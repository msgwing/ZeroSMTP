# GitHub Pages configuration for the ZeroSMTP documentation site.
#
# Serves docs/ at https://docs.msgwing.com/ so the guides are indexable as
# ordinary HTML pages. Raw .md files under github.com/*/blob/* are poorly
# ranked by search engines; someone searching an SMTP error message
# mid-outage needs to actually find these.
#
# Page titles below are kept under ~50 chars: jekyll-seo-tag appends
# " | ZeroSMTP" to every one (~11 chars), and anything past ~60 total gets
# truncated or flagged by Bing/Google as "title too long".
#
# Built via a custom Actions workflow (.github/workflows/pages-deploy.yml,
# docs/Gemfile), not GitHub Pages' classic "Deploy from a branch" build -
# needed for jekyll-last-modified-at (see docs/_config_actions.yml), which
# isn't on that build's allowed-plugin list.

title: ZeroSMTP
tagline: Free SMTP relay that still accepts basic username/password auth
# Where this actually surfaces, checked against the live site 2026-08-19:
# the <subtitle> of feed.xml, and the meta description of any page that has
# no `description:` of its own - which today is none of the 40, all of them
# have one either from a scope below or from generated front matter. It is
# NOT the JSON-LD description; jekyll-seo-tag uses the page's there.
#
# It is still an offer, so it carries both limits - the 200/day cap and the
# from-address - because the next page added here inherits it by default.
# See the index.md scope for the other offer. 159 chars, under ~160.
description: >-
  Free SMTP relay for printers, scanners and legacy apps that cannot do
  OAuth 2.0. Plain username/password auth, 200 messages a day from an
  @msgwing.com address.

url: https://docs.msgwing.com
baseurl: ""

# Preview image used when a docs link is shared in Slack, Teams, Reddit, etc.
image: /assets/social-preview.png

theme: jekyll-theme-primer

plugins:
  - jekyll-seo-tag           # <title>, meta description, canonical, JSON-LD
  - jekyll-sitemap           # sitemap.xml for crawlers
  - jekyll-relative-links    # rewrites [x](FAQ.md) to working site URLs
  - jekyll-optional-front-matter  # render .md files that have no front matter
  # jekyll-last-modified-at goes here once pages-deploy.yml (Actions build)
  # is live and the repo's Pages source is switched to it - it isn't on the
  # classic build's allowed-plugin list and breaks that build if listed here
  # before the switch.

relative_links:
  enabled: true
  collections: false

# Per-page titles and descriptions live here rather than in front matter so
# the .md files stay clean when read on github.com.
#
# The top-level `image:` key above is NOT picked up by jekyll-seo-tag for
# og:image/twitter:image - that plugin's ImageDrop (lib/jekyll-seo-tag/
# image_drop.rb) only reads page["image"], never site.image, "to preserve
# backwards compatibility" per its own source. So every page needs its own
# `image` value; setting it here, in a scope matching every page, is the one
# place to do that instead of repeating it in each entry below. This also
# fixes the Twitter card type: the plugin's template only emits
# summary_large_image when an image is present, and falls back to the
# smaller `summary` card otherwise.
defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/social-preview.png
  # The generated reference pages. Scoped by directory so a page added by
  # tools/build-error-pages.py or build-device-table.py inherits the markup
  # without anybody remembering to list it - the alternative is a per-file
  # scope that goes stale the first time a generator runs.
  # The two pages backed by a published dataset rather than by prose.
  - scope:
      path: "DEVICE-COMPATIBILITY.md"
    values:
      schema: dataset
      dataset_url: /data/devices.json
  - scope:
      path: "ERROR-MESSAGES.md"
    values:
      schema: dataset
      dataset_url: /data/errors.json
  - scope:
      path: "errors"
    values:
      schema: reference
  - scope:
      path: "devices"
    values:
      schema: reference
  - scope:
      path: "index.md"
    values:
      title: "Free SMTP relay that still accepts basic auth"
      # The homepage is where the offer is made, so both limits are in the
      # description itself, not only in the body. "no credit card" was
      # removed rather than supplemented: in free-tier idiom it means "no
      # paid gate", and next to an unstated cap the reader finishes the
      # sentence as "unlimited". 157 chars, under the ~160 SERP budget.
      description: >-
        Free SMTP relay for printers, scanners and legacy apps hit by the
        Microsoft 365 SMTP AUTH shutdown. 200 messages a day from a generated
        @msgwing.com address.
      widget: countdown
  - scope:
      path: "EXCHANGE-ONLINE-SMTP-AUTH.md"
    values:
      title: "Exchange Online SMTP AUTH Basic auth shutdown"
      description: >-
        Microsoft disables Basic auth for SMTP AUTH at the end of 2026.
        Timeline, the 535 5.7.139 error, and every migration option for
        printers and legacy apps.
      widget: quiz
  - scope:
      path: "AFFECTED-SYSTEMS.md"
    values:
      title: "Systems affected by the SMTP AUTH shutdown"
      description: >-
        Risk assessment of printers, NAS units, backup jobs, monitoring tools
        and line-of-business apps that stop sending email, with a PowerShell
        audit.
  - scope:
      path: "PRINTERS.md"
    values:
      title: "Printer scan-to-email SMTP setup by brand"
      description: >-
        Fix scan-to-email after Microsoft 365 disables Basic auth. Per-brand
        SMTP settings for Ricoh, Canon, Xerox, HP, Kyocera, Konica Minolta,
        Sharp and more.
      schema: printers-howto
      widget: printers
  - scope:
      path: "TROUBLESHOOTING.md"
    values:
      title: "SMTP troubleshooting: ports, TLS, auth errors"
      description: >-
        Why SMTP sending hangs or fails: cloud providers blocking outbound
        ports, certificate verification problems, authentication errors and
        rate limits.
  - scope:
      path: "FAQ.md"
    values:
      title: "FAQ — custom domains, usernames, limits"
      description: >-
        Can I use ZeroSMTP with my own hosting and domain? Will mail come from
        my domain? Sending limits, custom usernames, and why it is free.
      schema: faq
  - scope:
      path: "WINDOWS-SERVER.md"
    values:
      title: "Windows Server SMTP: IIS, PowerShell, Exchange"
      description: >-
        Send email from Windows Server without a local relay: ASP.NET
        web.config, PHP on IIS, scheduled PowerShell tasks, and Exchange send
        connectors.
  - scope:
      path: "SYSTEM-MTA.md"
    values:
      title: "Linux system-wide mail relay: Postfix, msmtp"
      description: >-
        Route all system mail (cron, monitoring, unattended-upgrades) through
        an SMTP relay, with systemd failure alerts and an Ansible rollout
        playbook.
  - scope:
      path: "LINUX.md"
    values:
      title: "Linux SMTP setup: Debian, Ubuntu, Fedora+"
      description: >-
        Per-distribution package names and setup for sending email from Linux
        scripts and applications.
  - scope:
      path: "APPS.md"
    values:
      title: "SMTP settings for popular applications"
      description: >-
        Ready-to-use SMTP configuration for common applications and platforms.
  - scope:
      path: "CODE-EXAMPLES.md"
    values:
      title: "SMTP send-email code examples, 19 languages"
      # Trimmed 2026-08-30 from 229 to 150 characters: Bing's URL Inspection
      # flagged the full 19-language list as "too long" for a meta
      # description. The page itself still names every language.
      description: >-
        Ready-to-run SMTP send-email examples for mx.msgwing.com in 19
        languages, from Python and PHP to Rust and PowerShell, plus Ansible
        and Docker Compose.
  - scope:
      path: "RELIABILITY.md"
    values:
      title: "Reliable email sending: retries and backoff"
      description: >-
        How to handle temporary SMTP failures correctly with backoff and
        retries instead of tight retry loops.
  - scope:
      path: "DEVICE-COMPATIBILITY.md"
    values:
      title: "OAuth compatibility by device and product"
      description: >-
        Which printers, MFPs, NAS units and applications have an OAuth 2.0
        path for the Microsoft 365 SMTP AUTH shutdown and which the vendor
        has ruled out, with a link to every vendor statement.
  - scope:
      path: "ERROR-MESSAGES.md"
    values:
      # People paste the error string verbatim, so this page exists to be
      # found by that paste - from any client, not only printers.
      title: "535 5.7.139 and other SMTP AUTH errors"
      description: >-
        What 535 5.7.139, SmtpClientAuthentication is disabled for the Tenant
        or Mailbox, 535 5.7.3 and Kyocera send error 1102 actually mean, the
        four different causes behind them, and which are still reversible.
  - scope:
      path: "NO-OAUTH-FIRMWARE.md"
    values:
      # Highest-intent page on the site: whoever lands here has been told by
      # their own vendor that no firmware is coming, so a relay is one of
      # only three remaining options rather than one of many.
      title: "Printers that will never get OAuth firmware"
      description: >-
        Printer and MFP models whose vendor has confirmed no OAuth 2.0
        firmware is planned for the Microsoft 365 SMTP AUTH shutdown,
        including the Konica Minolta ineo models marked N/A, and what is
        actually left once firmware is ruled out.
  - scope:
      path: "DEVICE-CASE-STUDIES.md"
    values:
      # The model number belongs in the title: someone whose scan-to-email
      # just broke searches the model, not the words "case study". As more
      # devices are reported, name them here too.
      title: "Canon Maxify MB2755 and other device fixes"
      description: >-
        Confirmed, hardware-tested SMTP fixes for specific printer and MFP
        models, including the Canon Maxify MB2755 certificate-verification
        issue: quirks and firmware limits the manuals don't mention.
  - scope:
      path: "MONITORING.md"
    values:
      title: "Monitoring alerts via SMTP relay"
      description: >-
        Drop-in email alert configuration for Zabbix, Nagios/Icinga, Uptime
        Kuma and PRTG using a free SMTP relay.
  - scope:
      path: "ALTERNATIVES.md"
    values:
      title: "ZeroSMTP vs. other free SMTP relays"
      description: >-
        How ZeroSMTP compares to SMTP2GO, Brevo and MailerSend: no DNS
        setup vs. sending from your own verified domain.

exclude:
  - assets/*.py

# Search-engine webmaster verification. Paste the token each console gives you;
# an empty value emits no tag at all, so a half-configured entry cannot ship a
# broken one.
#
# Google Search Console is the one that matters most and is the one missing:
# it reports the actual queries that brought somebody to this site, which is
# the only legitimate source for that - search queries are not public and there
# is no list of them anywhere to be found. Without it the seventeen error pages
# are aimed at a December traffic spike we have no way to watch.
#
#   Google: verified 2026-08-23 as a domain property (sc-domain:), so no tag is
#           needed here and the slot stays empty on purpose. Left in place
#           because a URL-prefix property would need one and the next person
#           should not have to re-derive that.
#   Bing:   bing.com/webmasters -> can import directly from Search Console
verification:
  google: ""
  bing: ""
  yandex: "54561a99b7e3ae2b"
