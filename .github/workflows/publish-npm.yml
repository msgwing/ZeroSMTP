name: Publish a package to npm

# Publishes one package from packages/ to the PUBLIC npm registry.
#
# Parameterised 2026-08-29 rather than copied. Two workflows publishing to
# the same registry with the same secret drift apart, and the one used less
# often is the one that rots - which would be the MCP server, the package
# whose download count is the only measurement the AI channel has.
#
# Not GitHub Packages. npm.pkg.github.com requires the person installing to
# authenticate with a GitHub token even for a public package, which makes it
# useless as a way for anybody to find or run the tool - and being findable
# and runnable with one `npx` is the entire reason this package exists.
#
# Manual only. A package version is permanent: npm allows unpublish for 72
# hours and then never again, and the name is claimed forever. That is not a
# thing to do on every push to main.
#
# Requires an NPM_TOKEN secret - an automation token from npmjs.com with
# publish rights. Until that secret exists this workflow cannot run, which is
# the intended state: publishing is the owner's decision.

on:
  workflow_dispatch:
    inputs:
      # No default that is a real package. A `choice` input always arrives
      # pre-filled, so the field the dispatcher must think about was the one
      # field they never had to touch - and twice, on 2026-08-30 and
      # 2026-08-31, the run went out on `zerosmtp-check` and died on "already
      # on npm" while the package that needed publishing sat at 1.0.1.
      # The sentinel below cannot publish anything, so leaving the form alone
      # now fails in four seconds with a sentence saying which field to set.
      package:
        description: 'Which package under packages/ to publish - you must change this'
        type: choice
        options:
          - '-- wybierz pakiet / pick a package --'
          - zerosmtp-check
          - zerosmtp-mcp
        default: '-- wybierz pakiet / pick a package --'
      # Was `true`. A default dry run means the ordinary, intended use of this
      # workflow - publishing - requires unticking a box, and the first attempt
      # on 2026-08-31 published nothing for exactly that reason. What actually
      # protects a version is the republish guard below plus the fact that this
      # workflow is manual only and needs NPM_TOKEN; neither depends on this
      # box. Tick it when you want a dry run, which is the rarer case.
      dry_run:
        description: 'Pack and validate without publishing (leave unticked to publish)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write        # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/${{ inputs.package }}
    steps:
      # Before the checkout, so a form left on its defaults costs four seconds
      # and says why, instead of failing later on a message about the wrong
      # package being already published.
      - name: A package was actually chosen
        if: ${{ startsWith(inputs.package, '--') }}
        # The job's default working-directory is packages/<input>, which for
        # the sentinel is not a directory and for anything else does not exist
        # yet - this step runs before the checkout on purpose.
        working-directory: ${{ github.workspace }}
        run: |
          echo "::error::Pole 'Which package under packages/ to publish' zostalo na wartosci domyslnej. Wybierz zerosmtp-check albo zerosmtp-mcp i uruchom ponownie."
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # npm's trusted publishing (OIDC) needs npm >= 11.5.1, and Node 22 ships
      # npm 10.x. Without this the workflow would ask for a token even after
      # a trusted publisher is configured, and the failure reads as "bad
      # credentials" rather than "wrong npm version" - which is the expensive
      # kind of error message. Harmless if we end up publishing with a token
      # instead: a newer npm publishes the same package either way.
      - name: npm new enough for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version
          node --version

      # Publishing something that does not work is worse than not publishing.
      # These are the same checks the lint workflow runs, repeated here so
      # that a manual dispatch cannot skip them.
      # `< /dev/null` because zerosmtp-mcp/index.js is a stdio MCP server that
      # reads stdin until EOF. It exits today only because Actions happens to
      # give a `run` step a null stdin; that is the runner's property, not the
      # step's, and the failure if it ever changes is a six-hour hang.
      - name: It runs
        run: node index.js --help < /dev/null
      - name: It reports a real result
        run: node index.js --json < /dev/null || [ $? = 1 ]

      - name: Refuse to republish an existing version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::error::$name@$version is already on npm. Bump the version."
            exit 1
          fi
          echo "$name@$version is not published yet."

      - name: Pack
        run: npm pack --dry-run

      - name: Publish
        if: ${{ inputs.dry_run == false }}
        # --provenance links the published tarball to this workflow run, so
        # anyone can verify on npmjs.com that it was built from this commit
        # in this repository rather than uploaded from somebody's laptop.
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run only - nothing was published." >> "$GITHUB_STEP_SUMMARY"
          else
            v=$(node -p "require('./package.json').version")
            echo "Published ${{ inputs.package }}@$v" >> "$GITHUB_STEP_SUMMARY"
            echo "https://www.npmjs.com/package/${{ inputs.package }}" >> "$GITHUB_STEP_SUMMARY"
          fi
