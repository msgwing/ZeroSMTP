name: Raport postępów

# Every three days, opens one issue in Polish with the numbers the owner asked
# for: what moved, what shipped, what is stuck and what still needs them.
#
# It exists because the owner delegated approval of changes to the team and
# asked, reasonably, to see whether any of it is producing anything. A
# delegation without a report is not delegation, it is disappearance.
#
# Two rules it is built around:
#
#   1. It reports the numbers, including the ones that did not move. A report
#      that only lists activity looks like progress even when nothing changed;
#      GitHub keeps traffic for 14 days and nobody else is writing it down, so
#      this is also the only trend the project has.
#   2. It never asks for a decision. Decisions about this repository belong to
#      the change board now. Anything genuinely needing the owner - a
#      third-party submission, a credential - is labelled `do-akceptacji` and
#      arrives separately.

on:
  schedule:
    - cron: '0 6 */3 * *'   # every three days, 06:00 UTC
  workflow_dispatch:

# No `administration:` here, however much the traffic endpoints want it: it is
# not a valid GITHUB_TOKEN permission, and adding it made GitHub reject the
# whole workflow at startup - a failure with no job and no log. The traffic
# API is simply out of reach for the Actions token; the report says so in
# words rather than pretending the numbers are zero.
permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read-only, used for nothing but the three traffic endpoints. It is
          # deliberately NOT set as this step's github-token: doing that would
          # make every write in here act as the owner, and GitHub does not
          # notify the actor who performed an action - the report would stop
          # mailing the one person it is written for. Absent is a supported
          # state and the report says so rather than failing.
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const since = new Date(Date.now() - 3 * 86400_000).toISOString();
            const day = new Date().toISOString().slice(0, 10);

            const num = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

            // --- traffic ---------------------------------------------------
            let views = null, referrers = [], paths = [];
            const trafficToken = process.env.TRAFFIC_TOKEN;
            try {
              if (!trafficToken) throw new Error('brak sekretu TRAFFIC_TOKEN');
              // Plain fetch rather than the octokit in `github`, because that
              // one is bound to GITHUB_TOKEN and must stay that way - see the
              // note on the env block above.
              const traffic = async (path) => {
                const r = await fetch(
                  `https://api.github.com/repos/${owner}/${repo}/${path}`, {
                    headers: {
                      authorization: `Bearer ${trafficToken}`,
                      accept: 'application/vnd.github+json',
                      'user-agent': 'zerosmtp-progress-report',
                    },
                  });
                if (!r.ok) throw new Error(`${path}: HTTP ${r.status}`);
                return r.json();
              };
              views = await traffic('traffic/views');
              referrers = await traffic('traffic/popular/referrers');
              paths = await traffic('traffic/popular/paths');
            } catch (e) {
              // Loud, not quiet. A report that silently drops the numbers it
              // exists to carry looks like a calm week.
              core.error(
                `Ruch niedostępny: ${e.message}. Raport pójdzie bez ` +
                `najważniejszych liczb - sprawdź uprawnienie administration: read.`);
            }

            const meta = (await github.rest.repos.get({ owner, repo })).data;

            // --- what shipped ----------------------------------------------
            const prs = (await github.rest.pulls.list({
              owner, repo, state: 'closed', sort: 'updated',
              direction: 'desc', per_page: 50,
            })).data.filter(p => p.merged_at && p.merged_at >= since);

            // --- queues ----------------------------------------------------
            const count = async (labels, state = 'open') =>
              (await github.rest.issues.listForRepo({
                owner, repo, state, labels, per_page: 100,
              })).data.filter(i => !i.pull_request).length;

            const outreach = await count('outreach');
            const listing = await count('listing');
            const waiting = await count('do-akceptacji');
            const alerts = await count('service-alert');

            // --- automation health -----------------------------------------
            const runs = (await github.rest.actions.listWorkflowRunsForRepo({
              owner, repo, per_page: 100,
            })).data.workflow_runs.filter(r => r.created_at >= since);
            const failed = runs.filter(r => r.conclusion === 'failure');
            const byWorkflow = {};
            for (const r of failed) byWorkflow[r.name] = (byWorkflow[r.name] || 0) + 1;

            // --- the relay --------------------------------------------------
            let relay = 'nieznany';
            try {
              const res = await fetch(
                `https://raw.githubusercontent.com/${owner}/${repo}/status/status.json`,
                { headers: { 'User-Agent': 'zerosmtp-progress-report' } });
              if (res.ok) relay = (await res.json()).message;
            } catch (e) { core.warning(e.message); }

            // --- did anything actually grow? ---------------------------------
            //
            // The owner's rule, 2026-08-22: they hear from this report when
            // reach went up, and when it did not, the company improves itself
            // instead of writing to them. A report that arrives on a timer
            // regardless of whether anything happened trains its reader to
            // stop opening it, and then the one that matters is missed too.
            //
            // Measured here is only what a workflow token can actually read.
            // Traffic endpoints need a personal token and are out of reach, so
            // they are not part of the test - a number that cannot be taken
            // must never be recorded as a zero.
            let npmWeek = null;
            try {
              const r = await fetch(
                'https://api.npmjs.org/downloads/point/last-week/zerosmtp-check',
                { headers: { 'User-Agent': 'zerosmtp-progress-report' } });
              // 404 means npm has no data for the window yet, which is not the
              // same as nobody downloading it. Stays null and is excluded.
              if (r.ok) {
                const j = await r.json();
                if (typeof j.downloads === 'number') npmWeek = j.downloads;
              }
            } catch (e) { core.warning(`npm downloads unreadable: ${e.message}`); }

            // The Marketplace listing needs a one-time signature nobody can
            // give on the owner's behalf - checked against the API, there is
            // no mutation that creates a listing. What can be automated is
            // noticing when it exists, so the company stops asking. 200 means
            // listed; anything else means not yet, and a network failure is
            // treated as unknown rather than as absent.
            let listed = null;
            try {
              const r = await fetch('https://github.com/marketplace/actions/zerosmtp-check',
                { method: 'HEAD', headers: { 'User-Agent': 'zerosmtp-progress-report' } });
              listed = r.status === 200;
            } catch (e) { core.warning(`marketplace unreadable: ${e.message}`); }

            const now = {
              stars: meta.stargazers_count,
              forks: meta.forks_count,
              watchers: meta.subscribers_count,
              npmWeek,
            };

            // Previous snapshot travels inside the previous report rather than
            // in a file, so this workflow needs no write access to anything.
            let before = null;
            try {
              const past = (await github.rest.issues.listForRepo({
                owner, repo, state: 'all', labels: 'raport',
                sort: 'created', direction: 'desc', per_page: 5,
              })).data.filter(i => !i.pull_request);
              for (const i of past) {
                const m = (i.body || '').match(/<!-- reach: (\{.*?\}) -->/);
                if (m) { before = JSON.parse(m[1]); break; }
              }
            } catch (e) { core.warning(`no previous snapshot: ${e.message}`); }

            // Growth means strictly more than last time on a number both runs
            // could read. The first ever run has nothing to compare against and
            // is not treated as growth - it is treated as a baseline.
            const moved = [];
            if (before) {
              for (const k of ['stars', 'forks', 'watchers', 'npmWeek']) {
                if (typeof now[k] === 'number' && typeof before[k] === 'number'
                    && now[k] > before[k]) {
                  moved.push(`${k}: ${before[k]} -> ${now[k]}`);
                }
              }
            }
            const grew = moved.length > 0;
            core.notice(before
              ? (grew ? `Wzrost: ${moved.join(', ')}` : 'Bez wzrostu - raport zostaje w firmie')
              : 'Pierwszy pomiar - punkt odniesienia, bez powiadomienia');

            // --- write it ----------------------------------------------------
            const L = [];
            if (grew) {
              L.push(`**Zasięgi wzrosły.** ${moved.join(' · ')}`, '');
            } else if (!before) {
              L.push('**Pierwszy pomiar.** Nie ma z czym porównać, więc to jest '
                + 'punkt odniesienia dla kolejnych cykli, a nie wynik.', '');
            } else {
              L.push('**Bez wzrostu w tym cyklu.** Ten raport nie został nikomu '
                + 'przypisany i nie wysłał powiadomienia — zgodnie z zasadą, że '
                + 'właściciel dostaje wynik wtedy, gdy jest wynik. Poniżej to, '
                + 'czego firma nie ruszyła, i to jest lista pracy na następny cykl.', '');
            }
            L.push(`Raport za ostatnie trzy dni, do **${day}**.`, '');

            if (listed === false) {
              L.push('> **Marketplace czeka na jeden podpis.** Akcja działa i jest',
                '> używalna przez `uses: msgwing/ZeroSMTP@v1.7.0` — brakuje tylko',
                '> wystawki w katalogu, a tej nie tworzy żadne API: to jednorazowa',
                '> akceptacja umowy dewelopera przy wydaniu. Ta linijka zniknie sama,',
                '> gdy wystawka będzie widoczna.', '');
            }
            L.push('## Liczby', '');
            L.push('| Miara | Wartość |', '|---|---|');
            if (views) {
              L.push(`| Unikalni odwiedzający (14 dni) | **${num(views.uniques)}** |`);
              L.push(`| Odsłony (14 dni) | ${num(views.count)} |`);
            } else {
              L.push('| Ruch | — _wymaga tokena osobistego, patrz niżej_ |');
            }
            L.push(`| Gwiazdki | **${meta.stargazers_count}** |`);
            L.push(`| Forki | ${meta.forks_count} |`);
            L.push(`| Obserwujący | ${meta.subscribers_count} |`);
            L.push('| Pobrania npm (7 dni) | '
              + (npmWeek === null ? '— _npm nie ma jeszcze danych_' : `**${num(npmWeek)}**`)
              + ' |');
            L.push(`| Przekaźnik | ${relay === 'operational' ? '✅ działa' : `⚠️ ${relay}`} |`);
            L.push('');

            if (referrers.length) {
              L.push('### Skąd przyszli', '', '| Źródło | Unikalni |', '|---|---|');
              for (const r of referrers.slice(0, 6)) {
                L.push(`| \`${r.referrer}\` | ${num(r.uniques)} |`);
              }
              L.push('');
            }

            if (paths.length) {
              L.push('### Co czytali', '');
              for (const p of paths.slice(0, 5)) {
                L.push(`- ${num(p.uniques)} — \`${p.path}\``);
              }
              L.push('');
            }

            L.push('## Co weszło', '');
            if (prs.length) {
              for (const p of prs) L.push(`- #${p.number} ${p.title}`);
            } else {
              L.push('**Nic.** Trzy dni bez zmergowanej zmiany to nie jest cisza — to jest zatrzymana praca.');
            }
            L.push('');

            L.push('## Kolejki', '');
            L.push('| Kolejka | Otwarte |', '|---|---|');
            L.push(`| Kandydaci outreach | ${outreach} |`);
            L.push(`| Kandydaci na listy | ${listing} |`);
            L.push(`| **Czeka na Ciebie** (\`do-akceptacji\`) | **${waiting}** |`);
            if (alerts) L.push(`| ⚠️ Awarie usługi | **${alerts}** |`);
            L.push('');

            L.push('## Automatyka', '');
            if (failed.length === 0) {
              L.push(`Wszystkie ${runs.length} biegów zakończonych bez porażki.`);
            } else {
              L.push(`**${failed.length} porażek** na ${runs.length} biegów:`, '');
              for (const [name, n] of Object.entries(byWorkflow)) {
                L.push(`- \`${name}\` — ${n}×`);
              }
            }
            L.push('');

            L.push('---', '');
            if (waiting > 0) {
              L.push(`**${waiting} spraw czeka na Twoje jedno kliknięcie** — etykieta \`do-akceptacji\`.`);
            } else {
              L.push('**Nic nie czeka na Twoją decyzję.** Zmiany w tym repozytorium zatwierdza rada;');
              L.push('do Ciebie trafia wyłącznie publikacja u obcych i tworzenie poświadczeń.');
            }
            L.push('');
            if (!views) {
              L.push('');
              L.push('> **Liczby odwiedzin są poza zasięgiem tego raportu.** Endpointy ruchu');
              L.push('> wymagają osobnego tokena, a sekret `TRAFFIC_TOKEN` nie jest ustawiony');
              L.push('> albo nie ma uprawnienia **Administration: Read-only**. Bez niego firma');
              L.push('> buduje strony na ślepo: nie widzi, które przynoszą ludzi.');
              L.push('> Do odczytania ręcznie w dowolnej chwili:');
              L.push('>');
              L.push('> ```bash');
              L.push('> gh api repos/' + owner + '/' + repo + '/traffic/views');
              L.push('> gh api repos/' + owner + '/' + repo + '/traffic/popular/referrers');
              L.push('> ```');
            }
            L.push('');
            L.push('_Raport generowany automatycznie co trzy dni. Nie wymaga odpowiedzi — poprzedni zamyka się sam._');

            // The next run reads this to decide whether anything moved. It
            // lives in the body so this workflow needs no write access to a
            // branch, and so the numbers cannot drift from the report that
            // published them.
            L.push('');
            L.push(`<!-- reach: ${JSON.stringify(now)} -->`);

            // Bez wzrostu raport nie tworzy zgloszenia. Zalozenie, ktore tu wczesniej
            // stalo - ze brak przypisania wystarczy, bo GitHub wysyla list tylko do
            // przypisanego - bylo niesprawdzone. Zmierzone 2026-08-25: skrzynka
            // powiadomien miala 14 pozycji, z czego 13 z naszego wlasnego repozytorium.
            // Wiadomosc od jedynego powtarzalnego kontrybutora, proszacego o zadanie
            // programistyczne, lezala w niej dwa dni.
            //
            // Zgloszenie w publicznym repozytorium trafia do skrzynki kazdego, kto je
            // obserwuje, niezaleznie od przypisania. Cykl bez wzrostu nie ma nic do
            // powiedzenia i nie ma prawa zajmowac miejsca, w ktorym szuka sie ludzi.
            //
            // Liczby nie gina - ida do podsumowania przebiegu, czytelnego w Actions,
            // ktore nie powiadamia nikogo.
            if (!grew) {
              await core.summary
                .addHeading(`Cykl bez wzrostu - ${day}`)
                .addRaw(L.join(String.fromCharCode(10)))
                .write();
              core.notice('Bez wzrostu - raport w podsumowaniu przebiegu, bez zgloszenia.');
              return;
            }
            
            const issue = await github.rest.issues.create({
              owner, repo,
              title: `Raport postepow - ${day}`,
              body: L.join(String.fromCharCode(10)),
              assignees: [owner],
              labels: ['raport'],
            });
            core.notice(`Raport: ${issue.data.html_url}`);

            // A report is a snapshot and the next one supersedes it. Left for a
            // person to close, three accumulated in six days and the owner had
            // to ask why fourteen issues were open. Nobody should have to
            // notice that: a bot that opens an issue on a schedule and never
            // closes one fills the queue until the queue stops being read -
            // which is the same lesson the outreach queue already taught.
            const older = (await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'raport', per_page: 100,
            })).data.filter(i => !i.pull_request && i.number !== issue.data.number);

            for (const o of older) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: o.number,
                body: `Zastąpiony przez #${issue.data.number}.`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: o.number,
                state: 'closed', state_reason: 'completed',
              });
              core.info(`Zamknięto poprzedni raport #${o.number}.`);
            }
