name: IndexNow ping

# Notifies IndexNow (Bing, Yandex, Seznam, Naver…) whenever a documentation
# page changes, so updated guides get recrawled in hours rather than waiting
# for the next scheduled crawl. Matters most around the Microsoft 365 SMTP
# AUTH deadline, when the migration guides are likely to be edited and need
# to be current in search results quickly.
#
# Only pages that actually changed in the push are submitted — blanket
# resubmission of unchanged URLs is discouraged by the IndexNow spec.
#
# The key is public by design: it's served at
# https://docs.msgwing.com/<key>.txt to prove domain ownership, so it is
# deliberately not stored as a secret.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**.md'
  workflow_dispatch:
    inputs:
      submit_all:
        description: 'Submit every page in the sitemap instead of only changed ones'
        type: boolean
        default: false

permissions:
  contents: read

env:
  INDEXNOW_KEY: f425a75e068d07b5a17b8d96b6e26e8b
  SITE_HOST: docs.msgwing.com

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Build the URL list
        id: urls
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.submit_all }}" = "true" ]; then
            echo "Submitting every page listed in the sitemap."
            urls=$(curl -sS --max-time 30 "https://${SITE_HOST}/sitemap.xml" \
              | grep -oP '(?<=<loc>)[^<]+')
          else
            echo "Collecting docs pages changed in this push."
            changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'docs/*.md' || true)
            urls=""
            for f in $changed; do
              base=$(basename "$f" .md)
              if [ "$base" = "index" ]; then
                urls="${urls}https://${SITE_HOST}/"$'\n'
              else
                urls="${urls}https://${SITE_HOST}/${base}.html"$'\n'
              fi
            done
          fi

          urls=$(printf '%s' "$urls" | sed '/^$/d')

          if [ -z "$urls" ]; then
            echo "No documentation pages changed — nothing to submit."
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'Submitting:\n%s\n' "$urls"
          count=$(printf '%s\n' "$urls" | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"

          # Build the JSON payload with jq so URLs are escaped correctly.
          printf '%s\n' "$urls" | jq -R . | jq -s \
            --arg host "$SITE_HOST" \
            --arg key "$INDEXNOW_KEY" \
            --arg loc "https://${SITE_HOST}/${INDEXNOW_KEY}.txt" \
            '{host: $host, key: $key, keyLocation: $loc, urlList: .}' > payload.json

          cat payload.json

      - name: Submit to IndexNow
        if: steps.urls.outputs.count != '0'
        run: |
          set -euo pipefail
          status=$(curl -sS -o response.txt -w '%{http_code}' \
            --max-time 30 \
            -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data @payload.json)

          echo "HTTP $status"
          cat response.txt || true

          # 200 = accepted, 202 = accepted but key validation pending.
          case "$status" in
            200|202) echo "IndexNow accepted ${{ steps.urls.outputs.count }} URL(s)." ;;
            *) echo "::error::IndexNow rejected the submission (HTTP $status)."; exit 1 ;;
          esac
