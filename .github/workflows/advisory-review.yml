name: Vendor advisory review

# The compatibility list is only worth citing if it is current. Vendors keep
# publishing and revising SMTP AUTH advisories through 2026, and a page that
# quietly froze in August is worse than no page - it reads as authoritative
# while being wrong.
#
# This opens one issue a month with a checklist built from data/devices.json
# itself, so the vendor list cannot drift out of sync with the data the way a
# hardcoded list would. It does not scrape anything: reading a vendor's
# advisory and deciding what changed is the part that needs a person.

on:
  schedule:
    # 07:00 UTC on the 1st of each month.
    - cron: '0 7 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('data/devices.json', 'utf8'));

            const LABEL = 'advisory-review';

            // One open review issue at a time. If last month's is still open,
            // the backlog is the problem and a second issue does not help.
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: LABEL,
            });
            if (open.data.length > 0) {
              core.notice(
                `Issue #${open.data[0].number} is still open - not opening another.`);
              return;
            }

            // `updated` is a plain YYYY-MM-DD string maintained by hand in the
            // data file; treat a missing or unparseable value as "unknown"
            // rather than guessing a date.
            const updated = data.updated;
            const parsed = Date.parse(updated);
            const staleDays = Number.isNaN(parsed)
              ? null
              : Math.floor((Date.now() - parsed) / 86400000);

            const entries = data.entries || [];

            // Whether a vendor page still exists is a fact, not a judgement, so
            // it gets checked rather than listed for somebody to click. The
            // judgement - did the advisory change in a way that matters - stays
            // with a person, which is what the note below is about.
            //
            // This matters more than it looks. Every row in devices.json is only
            // worth citing because a vendor page stands behind it. When one of
            // those pages moves, the row keeps asserting something with nothing
            // holding it up, and nobody finds out until a reader clicks.
            // Three outcomes, not two, and the difference is the whole point.
            //
            // 404 and 410 are the vendor saying the page is gone: definite, and
            // the row behind it has lost its evidence. Anything else - a
            // timeout, a 403, a connection refused - means we could not reach
            // the page from a data centre, which is not the same thing at all.
            // Several of these vendors rate-limit or block non-residential
            // addresses: support.hp.com answered 200 by hand this morning and
            // refused a connection an hour later from the same machine.
            //
            // Flagging those as broken would fill this checklist with alarms
            // that are not real, and a checklist that cries wolf stops being
            // read - which costs more than the check was ever worth.
            const zywe = new Map();
            const adresy = [...new Set(entries.map(e => e.evidence).filter(Boolean))];
            for (const url of adresy) {
              try {
                const r = await fetch(url, {
                  redirect: 'follow',
                  signal: AbortSignal.timeout(20000),
                  // Pełny nagłówek przeglądarki, nie nazwa bota. Zendesk
                  // i część portali producentów odrzucają wszystko inne
                  // przez 403, a 403 od filtra nie odróżnia się w logu od
                  // 403 od serwera. 2026-08-25 przegląd zgłosił Cerberus
                  // jako niezweryfikowany; ten sam adres z nagłówkiem
                  // przeglądarki odpowiada 200. Sprawdzanie, które nie
                  // dociera do strony, produkuje pracę ręczną co miesiąc.
                  headers: {
                    'user-agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) '
                      + 'AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36',
                    'accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
                    'accept-language': 'en-US,en;q=0.9',
                  },
                });
                zywe.set(url, r.status === 200 ? 'ok'
                            : (r.status === 404 || r.status === 410) ? `gone (${r.status})`
                            : `unverified (${r.status})`);
              } catch (e) {
                zywe.set(url, 'unverified (no response)');
              }
            }
            const zgine = adresy.filter(u => String(zywe.get(u)).startsWith('gone'));
            const niepewne = adresy.filter(u => String(zywe.get(u)).startsWith('unverified'));
            core.info(`evidence: ${adresy.length} links, ${zgine.length} gone, `
              + `${niepewne.length} unverified from this runner`);

            // Group by vendor so a vendor with several product lines is one
            // checklist line, not four.
            const byVendor = new Map();
            for (const e of entries) {
              if (!byVendor.has(e.vendor)) byVendor.set(e.vendor, []);
              byVendor.get(e.vendor).push(e);
            }

            const checklist = [...byVendor.entries()]
              .sort((a, b) => a[0].localeCompare(b[0]))
              .map(([vendor, rows]) => {
                const links = rows
                  .map(r => r.evidence)
                  .filter((url, i, all) => url && all.indexOf(url) === i)
                  .map(url => {
                    const st = zywe.get(url);
                    // A link that does not answer 200 is flagged in the line
                    // itself. Burying it in a summary somewhere means the
                    // reviewer ticks the box and the row stays broken.
                    if (st === 'ok') return `[advisory](${url})`;
                    if (String(st).startsWith('gone')) {
                      return `[advisory](${url}) **— ${st}, this row has lost its evidence**`;
                    }
                    // Said quietly on purpose: it is a note that the check
                    // could not be taken, not a claim that anything is wrong.
                    return `[advisory](${url}) *(${st} from CI — check by hand)*`;
                  })
                  .join(' · ');
                const statuses = [...new Set(rows.map(r => r.status))].join(', ');
                return `- [ ] **${vendor}** — currently \`${statuses}\` — ${links}`;
              })
              .join('\n');

            const staleLine = staleDays === null
              ? `\`updated\` in data/devices.json is \`${updated}\`, which could not be parsed as a date.`
              : `data/devices.json was last marked updated **${updated}** — ${staleDays} days ago.`;

            const body = [
              'Monthly check that the compatibility list still matches what the',
              'vendors are publishing. Nothing here is automated on purpose:',
              'deciding whether an advisory changed in a way that matters is the',
              'part that needs reading.',
              '',
              staleLine,
              '',
              `Currently tracking **${entries.length} entries** across`,
              `**${byVendor.size} vendors**.`,
              '',
              '## Re-check each advisory',
              '',
              checklist,
              '',
              '## What to look for',
              '',
              '- A model moving off the "no OAuth firmware" list — that is the',
              '  single most valuable change to catch, because',
              '  [NO-OAUTH-FIRMWARE.md](../blob/main/docs/NO-OAUTH-FIRMWARE.md)',
              '  tells people their hardware is a write-off.',
              '- New models added to an existing advisory.',
              '- A vendor publishing an advisory for the first time — those are',
              '  new rows, and the reason to keep doing this.',
              '- A dead link. An entry whose evidence URL 404s cannot be checked',
              '  by a reader and should be replaced or removed.',
              '',
              '## When something changed',
              '',
              '1. Edit [`data/devices.json`](../blob/main/data/devices.json) and',
              '   bump its `updated` field.',
              '2. Run `python tools/build-device-table.py` to regenerate the',
              '   docs table. CI fails if you skip it.',
              '',
              'Close this issue when the pass is done, even if nothing changed —',
              'that is a useful signal too.',
            ].join('\n');

            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Vendor advisory review — ${new Date().toISOString().slice(0, 7)}`,
              body,
              labels: [LABEL, 'docs', 'printers'],
            });
            core.notice(`Opened #${created.data.number}`);
