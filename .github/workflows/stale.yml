name: Stale issues and PRs

# Keeps the tracker tidy without deleting anything a human hasn't already
# abandoned: marks issues/PRs stale after 60 days of inactivity, closes
# them 14 days later if still untouched. "service-alert" issues are
# exempt — those are actively managed by service-healthcheck.yml, not
# meant to be closed by inactivity.

on:
  schedule:
    - cron: '0 3 * * *' # daily 03:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          # "help wanted" i "good first issue" znacza "czekamy na ochotnika",
          # a nie "porzucone". Bez tych wyjatkow lej kontrybutorow zamyka sie
          # sam po 74 dniach - a zadania jezykowe potrafia czekac dluzej i to
          # jest normalne, nie problem.
          #
          # Uwaga: "pinned" to ETYKIETA, nie przypiecie w interfejsie GitHuba.
          # actions/stale nie widzi przypietych issues, wiec samo przypiecie
          # niczego nie chroni.
          exempt-issue-labels: 'service-alert,pinned,security,help wanted,good first issue'
          exempt-pr-labels: 'pinned'
          stale-issue-message: >
            This issue has had no activity for 60 days and will be closed in
            14 days if nothing changes. If it's still relevant, comment or
            remove the `stale` label to keep it open.
          stale-pr-message: >
            This pull request has had no activity for 60 days and will be
            closed in 14 days if nothing changes. Comment or push a commit
            to keep it open.
          close-issue-message: >
            Closing due to inactivity. Feel free to reopen if this is still
            relevant.
          close-pr-message: >
            Closing due to inactivity. Feel free to reopen or open a new PR.
