name: Do akceptacji

# Turns a finished piece of work into an email in the owner's inbox, in
# Polish, with the one action to take.
#
# Two problems this exists to solve, both found the hard way on 2026-08-17:
#
#   1. The discovery bots used to assign every raw candidate to the owner,
#      so the inbox filled with things that were not ready. Reviewing that
#      queue found eight leads and zero actionable ones - five threads
#      closed and resolved, two dead since 2022, one already answered by
#      the owner. Nothing should reach the inbox until it is finished.
#
#   2. GitHub suppresses notifications for the actor who performed the
#      action. Assigning the owner using the owner's own token emails
#      nobody, which is exactly what happened to those ten issues. This
#      workflow runs as github-actions[bot], a different actor, so the
#      assignment actually notifies.
#
# So: label an issue `do-akceptacji` once it is genuinely finished, and this
# assigns the owner and posts the Polish instruction. The label is the
# handover; the email is its side effect.

on:
  # Every two hours. A pull request from a first-time contributor cannot run
  # its required checks until somebody approves the workflow, and nothing was
  # watching that queue: on 2026-08-22 two pull requests from the first outside
  # contributor this project has ever had sat for fifteen hours, unable to
  # merge no matter how good they were. The approval requirement stays - it is
  # what stops a stranger's fork running code on our runners - but it stops
  # being invisible.
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
  issues:
    types: [labeled]

permissions:
  issues: write
  actions: read

jobs:
  assign:
    if: github.event.label.name == 'do-akceptacji'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const issue_number = context.issue.number;

            // Assigning is what sends the mail. Skip it if the owner is
            // already assigned, so re-labelling does not silently do nothing
            // and look like a failure.
            const current = (context.payload.issue.assignees || []).map(a => a.login);
            if (!current.includes(owner)) {
              await github.rest.issues.addAssignees({
                owner, repo: context.repo.repo, issue_number,
                assignees: [owner],
              });
              core.notice(`Przypisano ${owner} — mail powinien wyjść.`);
            } else {
              core.warning(
                `${owner} był już przypisany, więc GitHub nie wyśle powiadomienia ` +
                `o przypisaniu. Komentarz poniżej i tak trafi na maila.`);
            }

            // The comment carries the instruction. Polish, because the owner
            // reads these; the draft or entry inside the issue stays in the
            // language it will be posted in, which is English.
            const body = [
              '## Gotowe do akceptacji',
              '',
              'Ta sprawa jest skompletowana. Nic tu nie trzeba dopisywać ani poprawiać.',
              '',
              '**Co zrobić:** przeczytaj treść powyżej i wykonaj **jedną** czynność, którą opisuje —',
              'wklej gotową odpowiedź, zgłoś wpis albo kliknij przycisk. Potem zamknij to zgłoszenie.',
              '',
              '**Jeśli coś jest nie tak** — nie poprawiaj tego ręcznie. Zdejmij etykietę',
              '`do-akceptacji` i napisz w komentarzu, co nie gra. Poprawka trafi tam, gdzie',
              'powstał błąd, żeby nie wrócił.',
              '',
              '---',
              '',
              '_Treść przeznaczona do publikacji jest po angielsku celowo — w takim języku zostanie',
              'wklejona. Ta instrukcja jest po polsku, bo czytasz ją tylko Ty._',
            ].join('\n');

            await github.rest.issues.createComment({
              owner, repo: context.repo.repo, issue_number, body,
            });

  # Copilot zostal powolany do zarzadu 2026-08-25 i do dzis nie wykonal ani
  # jednej czynnosci: zero komentarzy, zero recenzji. Nie z powodu jakosci -
  # nie jest w tym repozytorium wystawiony jako aktor, ktoremu mozna cokolwiek
  # przypisac. Wlasciciel zaakceptowal wlaczenie, ale to ustawienie konta,
  # nie repozytorium, i nic po naszej stronie sie nie zmienilo.
  #
  # Zamiast wpisywac komus "pamietaj, zeby sprawdzac", pyta o to maszyna.
  # Milczy, dopoki stan sie nie zmieni. Gdy Copilot sie pojawi, zaklada
  # jedno zgloszenie i firma wie, ze etat moze zaczac prace.
  copilot:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const q = `{repository(owner:"${owner}",name:"${repo}"){` +
              `suggestedActors(capabilities:[CAN_BE_ASSIGNED],first:20){nodes{login}}}}`;
            let aktorzy = [];
            try {
              const r = await github.graphql(q);
              aktorzy = r.repository.suggestedActors.nodes.map(n => n.login);
            } catch (e) {
              core.warning(`Nie udalo sie odpytac o aktorow: ${e.message}`);
              return;
            }
            const jest = aktorzy.some(a => /copilot/i.test(a));
            core.info(`Aktorzy: ${aktorzy.join(', ') || 'brak'}`);
            if (!jest) {
              core.info('Copilot nadal niedostepny - bez zgloszenia.');
              return;
            }
            const MARKER = '<!-- copilot-dostepny -->';
            const otwarte = (await github.rest.issues.listForRepo({
              owner, repo, state: 'all', per_page: 50, labels: 'do-akceptacji',
            })).data;
            if (otwarte.some(i => (i.body || '').includes(MARKER))) {
              core.info('Zgloszenie o dostepnosci Copilota juz istnieje.');
              return;
            }
            const NL2 = String.fromCharCode(10);
            await github.rest.issues.create({
              owner, repo,
              title: 'Copilot jest juz dostepny - etat moze zaczac prace',
              body: [
                MARKER,
                'Zapytanie o aktorow zwrocilo Copilota, czego przez caly czas',
                'od powolania nie robilo. Etat doradcy zarzadu moze zaczac',
                'wykonywac zadania weryfikacyjne.',
                '',
                `Zwroceni aktorzy: ${aktorzy.join(', ')}`,
                '',
                'Pierwsze zadanie: recenzja najblizszego otwartego pull requesta.',
              ].join(NL2),
              labels: ['do-akceptacji'],
            });
            core.notice('Copilot dostepny - zalozono zgloszenie.');

  # Czlowiek z zewnatrz nie czeka dluzej niz PROG godzin bez odpowiedzi.
  #
  # DLACZEGO TO ISTNIEJE: 2026-08-26 jedyny powtarzalny kontrybutor tego
  # projektu zlozyl #300 - testy, o ktore sam poprosil - i czekal
  # **15 godzin 42 minuty**. Dwa dni wczesniej ten sam czlowiek czekal dwa dni
  # na odpowiedz w watku, w ktorym prosil o prace programistyczna.
  #
  # Za kazdym razem przyczyna byla ta sama: **nikt tego nie pilnowal**.
  # Skrzynka powiadomien ma 14 pozycji, z czego 13 to nasze wlasne boty, wiec
  # jedyny czlowiek w niej tonie. Zapisanie reguly "czytaj powiadomienia"
  # juz raz zawiodlo - stad zadanie zamiast zdania w pliku.
  #
  # Przypisanie wlasciciela jest tu calym mechanizmem: GitHub wysyla list
  # tylko do przypisanego. Etykieta pilnuje, zeby zrobic to raz.
  #
  # NAPRAWIONE 2026-08-30, patrz #265. Ta kontrola pytala dotad "czy AUTOR
  # ZGLOSZENIA jest czlowiekiem z zewnatrz, i czy KIEDYKOLWIEK odpowiedzielismy
  # gdziekolwiek w watku". #265 zostalo otwarte przez wlasciciela (`msgwing`),
  # wiec nie przechodzilo nawet pierwszego warunku - mimo ze ostatni komentarz,
  # od prawdziwego czlowieka z zewnatrz (`k4its1t`, association: none), czekal
  # SZESC DNI bez odpowiedzi. Znalezione przypadkiem, przy okazji zupelnie
  # innego zadania - dokladnie taka cisza mogla trwac w nieskonczonosc.
  #
  # Wlasciwe pytanie: kto napisal OSTATNIA rzecz w watku, niezaleznie od tego,
  # kto go otworzyl i czy odpowiadalismy wczesniej. Logika jest w
  # `tools/unanswered-external.js`, testowana na prawdziwych danych #265 w
  # `tools/unanswered-external.test.js` - wydzielona z YAML zeby dalo sie ja
  # przetestowac raz, zamiast ufac skladni sklejonej w kroku workflow.
  czeka-czlowiek:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/github-script@v9
        with:
          script: |
            const { ocenWatek } = await import(
              `${process.env.GITHUB_WORKSPACE}/tools/unanswered-external.js`);

            const owner = context.repo.owner, repo = context.repo.repo;
            const PROG_H = 4;
            const ETYKIETA = 'czeka-czlowiek';
            const ACK = 'Ten komentarz zostal dodany automatycznie';
            const granica = Date.now() - PROG_H * 3600 * 1000;

            const watki = (await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100, sort: 'created',
            })).data;

            let oznaczonych = 0, odznaczonych = 0;
            for (const w of watki) {
              const kom = (await github.rest.issues.listComments({
                owner, repo, issue_number: w.number, per_page: 100,
              })).data;

              let rec = [];
              if (w.pull_request) {
                rec = (await github.rest.pulls.listReviews({
                  owner, repo, pull_number: w.number, per_page: 100,
                })).data;
              }

              const { czeka, ostatniZewnetrzny, jujAcked } =
                ocenWatek(w, kom, rec, owner, ACK);
              const maEtykiete = (w.labels || []).some(l => l.name === ETYKIETA);

              if (!czeka) {
                // Ostatnie slowo jest teraz nasze - jesli bylo oznaczone
                // wczesniej, przestalo to byc prawda i etykieta ma to
                // odzwierciedlac, zeby liczyla sie do biezacego stanu, a nie
                // do historii.
                if (maEtykiete) {
                  await github.rest.issues.removeLabel({
                    owner, repo, issue_number: w.number, name: ETYKIETA,
                  });
                  core.notice('Zdjeto etykiete #' + w.number + ' - odpowiedziano.');
                  odznaczonych++;
                }
                continue;
              }

              if (new Date(ostatniZewnetrzny.at).getTime() > granica) continue;

              if (!maEtykiete) {
                try {
                  await github.rest.issues.createLabel({
                    owner, repo, name: ETYKIETA, color: 'D93F0B',
                    description: 'Ostatni komentarz jest od kogos z zewnatrz - czeka na nasza odpowiedz.',
                  });
                } catch (e) { /* juz istnieje */ }
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: w.number, labels: [ETYKIETA],
                });
                await github.rest.issues.addAssignees({
                  owner, repo, issue_number: w.number, assignees: [owner],
                });
              }

              // Juz raz potwierdzone dla tego samego ostatniego komentarza -
              // nie dublowac "dziekujemy" przy kazdym przebiegu co dwie godziny.
              if (jujAcked) continue;

              const godzin = Math.round(
                (Date.now() - new Date(ostatniZewnetrzny.at).getTime()) / 3600000);
              const NL = String.fromCharCode(10);

              await github.rest.issues.createComment({
                owner, repo, issue_number: w.number,
                body: [
                  '@' + ostatniZewnetrzny.autor + ' - dziekujemy, widzimy to i odpowiemy.',
                  '',
                  ACK + ' po ' + godzin
                    + ' godzinach bez odpowiedzi z naszej strony. Nie zastepuje',
                  'odpowiedzi - jest po to, zeby watek nie utknal niezauwazony.',
                ].join(NL),
              });
              core.notice('Oznaczono #' + w.number + ' od @' + ostatniZewnetrzny.autor + ' - czeka ' + godzin + 'h');
              oznaczonych++;
            }

            if (oznaczonych === 0 && odznaczonych === 0) {
              core.info('Nikt z zewnatrz nie czeka dluzej niz ' + PROG_H + 'h, nic sie nie zmienilo.');
            }

  # `czeka-czlowiek` powyzej powiadamia natychmiast (4h) o pojedynczym watku.
  # To jest druga polowa zadania wlasciciela z 2026-08-30: jeden zbiorczy
  # widok, zeby nie trzeba bylo pamietac o przegladaniu 17 osobnych zgloszen,
  # i eskalacja dla tych, ktore mimo powiadomienia stoja dluzej niz cykl
  # pracy (3 dni) - dokladnie tak dlugo stalo #265, zanim ktos je znalazl.
  #
  # Jedna, samoaktualizujaca sie pozycja - ten sam wzorzec co dashboard
  # kolejki CI w jobie `waiting` ponizej: tytul jest markerem, wiec kolejny
  # przebieg edytuje te sama pozycje zamiast mnozyc zgloszenia, i zamyka ja
  # sama, gdy kolejka jest pusta.
  zalegle-zewnetrzne:
    if: github.event_name != 'issues'
    needs: czeka-czlowiek
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/github-script@v9
        with:
          script: |
            const { ocenWatek } = await import(
              `${process.env.GITHUB_WORKSPACE}/tools/unanswered-external.js`);

            const owner = context.repo.owner, repo = context.repo.repo;
            const ETYKIETA = 'czeka-czlowiek';
            const ACK = 'Ten komentarz zostal dodany automatycznie';
            const PROG_DNI = 3;
            const granica = Date.now() - PROG_DNI * 86400_000;
            const TYTUL = 'Zewnetrzne komentarze bez odpowiedzi';
            const ZALEGLE = 'stan:zalegle';
            const NL = String.fromCharCode(10);
            const TICK = String.fromCharCode(96);

            // `czeka-czlowiek` juz odfiltrowal - kazdy wpis tutaj naprawde
            // ma ostatnie slowo od kogos z zewnatrz. Wiek liczymy jednak z
            // TEGO SAMEGO zrodla co tamten job (data ostatniego zewnetrznego
            // komentarza), a nie z `updated_at` zgloszenia - `updated_at`
            // zmienia sie przy kazdym dodaniu/zdjeciu etykiety, wiec sam nic
            // nie mowi o tym, jak dawno ktos naprawde napisal.
            const watki = (await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: ETYKIETA, per_page: 100,
            })).data;

            const ocenione = [];
            for (const w of watki) {
              const kom = (await github.rest.issues.listComments({
                owner, repo, issue_number: w.number, per_page: 100,
              })).data;
              let rec = [];
              if (w.pull_request) {
                rec = (await github.rest.pulls.listReviews({
                  owner, repo, pull_number: w.number, per_page: 100,
                })).data;
              }
              const wynik = ocenWatek(w, kom, rec, owner, ACK);
              if (wynik.czeka) ocenione.push({ w, ostatni: wynik.ostatniZewnetrzny });
            }

            let dotknietych = 0;
            for (const { w, ostatni } of ocenione) {
              if (new Date(ostatni.at).getTime() > granica) continue;
              if ((w.labels || []).some(l => l.name === ZALEGLE)) continue;
              await github.rest.issues.addLabels({
                owner, repo, issue_number: w.number, labels: [ZALEGLE],
              });
              dotknietych++;
            }
            if (dotknietych) core.notice(dotknietych + ' watek(ow) przekroczylo ' + PROG_DNI + ' dni - oznaczone ' + ZALEGLE + '.');

            const dashboard = (await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: ZALEGLE, per_page: 100,
            })).data.filter(i => i.title === TYTUL);

            if (!ocenione.length) {
              for (const i of dashboard) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: i.number,
                  body: 'Kolejka pusta - kazdy zewnetrzny komentarz ma odpowiedz. Zamykam.',
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: i.number, state: 'closed',
                });
              }
              core.info('Zaden otwarty watek nie czeka na zewnetrznego czlowieka.');
              return;
            }

            const wiekDni = (at) =>
              Math.floor((Date.now() - new Date(at).getTime()) / 86400_000);
            const posortowane = [...ocenione].sort(
              (a, b) => new Date(a.ostatni.at) - new Date(b.ostatni.at));

            const wiersze = posortowane.slice(0, 20).map(
              ({ w, ostatni }) => '| ' + wiekDni(ostatni.at) + ' dni | #' + w.number +
                   ' | @' + ostatni.autor + ' | ' +
                   TICK + (w.title || '').replace(/\|/g, '\\|').slice(0, 50) + TICK + ' |');

            const body = [
              '**' + ocenione.length + ' otwarty(ch) watek(ow), gdzie ostatnie slowo nie jest nasze.**',
              '',
              'Zbudowane po tym, jak #265 czekalo 6 dni bez odpowiedzi na konkretne',
              'pytanie techniczne - otwarte przez wlasciciela, wiec dotychczasowy',
              'nadzor patrzacy na autora zgloszenia go nie widzial. Ta lista patrzy',
              'na autora OSTATNIEGO komentarza, nie na to, kto otworzyl watek.',
              '',
              'Watki starsze niz ' + PROG_DNI + ' dni dostaja dodatkowo etykiete `' + ZALEGLE + '`.',
              '',
              '| Czeka | Watek | Kto czeka | Tytul |',
              '|---|---|---|---|',
              ...wiersze,
              '',
              '_To zgloszenie zamknie sie samo, gdy kazdy watek dostanie odpowiedz._',
            ].join(NL);

            if (dashboard.length) {
              await github.rest.issues.update({
                owner, repo, issue_number: dashboard[0].number, body,
              });
              core.notice('Zaktualizowano #' + dashboard[0].number);
            } else {
              const issue = await github.rest.issues.create({
                owner, repo, title: TYTUL, body, labels: [ZALEGLE],
              });
              core.notice('Utworzono ' + issue.data.html_url);
            }

  # Kontrybutor, ktoremu SCALILISMY prace i nie powiedzielismy ani slowa.
  #
  # DLACZEGO OSOBNE ZADANIE, SKORO JEST `czeka-czlowiek` POWYZEJ: tamto pyta
  # GitHuba o `state: 'open'`. Scalony pull request jest ZAMKNIETY, wiec
  # przyjeta i nieodnotowana praca byla dla niego niewidzialna z definicji -
  # nie przez blad w nim. Ta sama slepota dotyczy `zalegle-zewnetrzne`, bo
  # startuje z tej samej listy.
  #
  # Zmierzone 2026-09-01 na wszystkich 14 scalonych wnioskach od ludzi z
  # zewnatrz: PIEC nie ma ani jednego naszego slowa. #238 i #245 czekaly
  # dziewiec dni. Zaden przeglad ich nie znalazl, bo zaden nie patrzyl na
  # rzeczy zamkniete - a to jest jedyne miejsce, gdzie konczy sie przyjeta
  # praca.
  #
  # CZEGO TO ZADANIE CELOWO NIE ROBI:
  #
  #   - nie pisze podziekowan. Automatyczne "dziekujemy" jest gorsze niz
  #     cisza, bo mowi czlowiekowi wprost, ze po drugiej stronie nie bylo
  #     nikogo. Bramka pokazuje, komu jestesmy winni slowo; slowo pisze
  #     czlowiek albo agent, imiennie i o tym, co ta osoba faktycznie zrobila.
  #   - nie zaczepia nikogo, kto ucichl. Uspienie jest w tabeli kontekstu i
  #     nigdy nie zaklada tego zgloszenia samo. Prog jest nieskalibrowany
  #     (n=2 odstepy od jednej osoby), a analiza forkujacych z 2026-08-27 juz
  #     raz pokazala, ze przy takiej probie profilowanie ludzi nie ma pokrycia.
  #   - nie przypisuje wlasciciela. To jest praca firmy, nie jego.
  #
  # Logika siedzi w `tools/contributor-care.js`, testowana na prawdziwych
  # danych tych 14 wnioskow w `tools/contributor-care.test.js`, i importuje
  # regule "kto napisal ostatni" z `tools/unanswered-external.js` zamiast
  # trzymac jej druga kopie.
  opieka-nad-kontrybutorami:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/github-script@v9
        with:
          script: |
            const { ocenWklad, ocenOpieke, PROGI } = await import(
              `${process.env.GITHUB_WORKSPACE}/tools/contributor-care.js`);

            const owner = context.repo.owner, repo = context.repo.repo;
            const ACK = 'Ten komentarz zostal dodany automatycznie';
            const TYTUL = 'Kontrybutorzy bez odpowiedzi';
            const ZALEGLE = 'stan:zalegle';
            const NL = String.fromCharCode(10);
            const TICK = String.fromCharCode(96);
            const teraz = Date.now();

            // Wnioski scalone, nie nasze, nie bota. Zapytanie sprawdzone
            // 2026-09-01 wobec niezaleznego `gh pr list --state merged`:
            // oba daja te same 14 numerow.
            const znalezione = (await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:pr is:merged -author:${owner} -author:app/dependabot`,
              per_page: 100,
            })).data.items;

            if (!znalezione.length) {
              // DOCTRINE §9: cisza i awaria wygladaja tak samo. Zero
              // scalonych wkladow od ludzi z zewnatrz jest mozliwe tylko w
              // repozytorium, ktore nigdy zadnego nie mialo - a to nie jest
              // to repozytorium. Glosno, zamiast "nic nie znaleziono".
              core.setFailed(
                'Zapytanie nie zwrocilo ANI JEDNEGO scalonego wniosku z zewnatrz. ' +
                'To repozytorium ma ich 14, wiec to jest awaria zapytania, ' +
                'nie pusta kolejka.');
              return;
            }

            const wklady = [];
            for (const it of znalezione) {
              const kom = (await github.rest.issues.listComments({
                owner, repo, issue_number: it.number, per_page: 100,
              })).data;
              const rec = (await github.rest.pulls.listReviews({
                owner, repo, pull_number: it.number, per_page: 100,
              })).data;

              wklady.push(ocenWklad(
                {
                  number: it.number,
                  title: it.title,
                  user: it.user,
                  created_at: it.created_at,
                  merged_at: it.pull_request.merged_at,
                  pull_request: it.pull_request,
                },
                kom, rec, owner, ACK, teraz));
            }

            const o = ocenOpieke(wklady, teraz, PROGI);
            core.info(`wkladow: ${wklady.length}, dlug: ${o.dlug}, ` +
              `bez slowa: ${o.bezPotwierdzenia.length}, ` +
              `ostatnie slowo ich: ${o.ostatnieSlowoIch.length}, ` +
              `retencja: ${o.retencja.powracajacych}/${o.retencja.kontrybutorow}`);

            const istniejace = (await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: ZALEGLE, per_page: 100,
            })).data.filter((i) => !i.pull_request && i.title === TYTUL);

            // Zamyka sie samo. To jest jedyny sposob, w jaki mozna zobaczyc,
            // ze kolejka jest pusta - tak samo jak w `zalegle-zewnetrzne`.
            if (!o.dlug) {
              for (const i of istniejace) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: i.number,
                  body: 'Kazdy scalony wklad z zewnatrz ma nasza odpowiedz. Zamykam.',
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: i.number, state: 'closed',
                });
              }
              core.info('Zero dlugu wobec kontrybutorow.');
              return;
            }

            const esc = (t) => (t || '').replace(/\|/g, '-').slice(0, 46);
            const wiersz = (w) => '| ' + w.dniOdScalenia + ' dni | #' + w.numer +
              ' | @' + w.autor + ' | ' + TICK + esc(w.tytul) + TICK + ' |';

            const body = [];
            body.push('**' + o.dlug + ' scalony(ch) wklad(ow) od ludzi z zewnatrz czeka na slowo od nas.**');
            body.push('');
            body.push('Ta lista patrzy na wnioski **scalone**, czyli zamkniete. `czeka-czlowiek`');
            body.push('i `zalegle-zewnetrzne` pytaja o `state: open`, wiec przyjeta i nieodnotowana');
            body.push('praca byla dla nich niewidzialna z definicji.');
            body.push('');

            if (o.bezPotwierdzenia.length) {
              body.push('### Ani jednego naszego slowa');
              body.push('');
              body.push('Praca przyjeta, watek bez komentarza i bez recenzji z trescia od nas.');
              body.push('');
              body.push('| Od scalenia | Wniosek | Kto | Tytul |');
              body.push('|---|---|---|---|');
              for (const w of o.bezPotwierdzenia) body.push(wiersz(w));
              body.push('');
            }

            if (o.ostatnieSlowoIch.length) {
              body.push('### Rozmowa byla, ostatnie zdanie zostalo ich');
              body.push('');
              body.push('| Od scalenia | Wniosek | Kto | Tytul |');
              body.push('|---|---|---|---|');
              for (const w of o.ostatnieSlowoIch) body.push(wiersz(w));
              body.push('');
            }

            body.push('### Co z tym zrobic');
            body.push('');
            body.push('Napisz w kazdym z tych watkow **imiennie i konkretnie** - co ta zmiana');
            body.push('dodala i co to zmienia. "Dzieki" jest szumem; "to pierwszy potwierdzony');
            body.push('raport dla tej galezi firmware, jest juz na liscie zgodnosci" mowi');
            body.push('czlowiekowi, co kupilo jego piec minut.');
            body.push('');
            body.push('**Ta bramka celowo nie pisze tych slow sama.** Automatyczne podziekowanie');
            body.push('jest gorsze niz cisza - mowi wprost, ze po drugiej stronie nie bylo nikogo.');
            body.push('');
            body.push('---');
            body.push('');
            body.push('### Kontekst - te liczby NIE zakladaja tego zgloszenia');
            body.push('');
            body.push('**Retencja: ' + o.retencja.powracajacych + ' z ' +
              o.retencja.kontrybutorow + ' kontrybutorow zlozylo wiecej niz jeden wklad.**');
            body.push('To jest liczba zliczona, nie prognoza - nie mowi, dlaczego ktos nie wrocil.');
            body.push('');

            if (o.usypiajacy.length) {
              body.push('**Ucichli (>= ' + PROGI.uspienieDni + ' dni od ICH ostatniej czynnosci, nie od naszego scalenia):**');
              body.push('');
              for (const p of o.usypiajacy) {
                body.push('- @' + p.login + ' - ' + p.dni + ' dni, wkladow: ' + p.wkladow);
              }
              body.push('');
              body.push('**Prog ' + PROGI.uspienieDni + ' dni jest nieskalibrowany i nie udajemy inaczej.**');
              body.push('Jedyne dane, na ktorych da sie go oprzec, to dwa odstepy miedzy wkladami');
              body.push('jednej osoby (3 i 4 dni). Czy zaczepienie kogos, kto ucichl, pomaga czy');
              body.push('szkodzi - **tego nie da sie tutaj zmierzyc** i nikt tego nie zmierzyl.');
              body.push('Ta lista jest informacja dla czlowieka, nie poleceniem kontaktu.');
              body.push('');
            }

            body.push('_To zgloszenie zamknie sie samo, gdy kazdy scalony wklad dostanie odpowiedz._');

            const tresc = body.join(NL);

            if (istniejace.length) {
              await github.rest.issues.update({
                owner, repo, issue_number: istniejace[0].number, body: tresc,
              });
              core.notice('Zaktualizowano #' + istniejace[0].number + ' - dlug: ' + o.dlug);
            } else {
              const zgl = await github.rest.issues.create({
                owner, repo, title: TYTUL, body: tresc,
                // Jedna etykieta stanu, zgodnie z regula "kazde otwarte
                // zgloszenie nosi dokladnie jedna". Zalegle jest wlasciwe:
                // nikt tego nie robi i nikt nie czeka na wlasciciela.
                labels: [ZALEGLE],
              });
              core.notice('Utworzono ' + zgl.data.html_url);
            }

  waiting:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const NL = String.fromCharCode(10);
            const TICK = String.fromCharCode(96);

            const runs = (await github.rest.actions.listWorkflowRunsForRepo({
              owner, repo, status: 'action_required', per_page: 100,
            })).data.workflow_runs;

            const TYTUL = 'Przebiegi CI czekaja na zatwierdzenie';
            const open = (await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'stan:zalegle', per_page: 100,
            })).data.filter(i => !i.pull_request && i.title === TYTUL);

            if (!runs.length) {
              // Nothing waiting. Close the reminder rather than leaving a stale
              // one open: an alert that outlives its cause is how a queue stops
              // being read, which is the lesson the outreach queue already cost.
              for (const i of open) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: i.number,
                  body: 'Kolejka pusta - nic nie czeka na zatwierdzenie. Zamykam.',
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: i.number, state: 'closed',
                });
              }
              core.info('Nic nie czeka.');
              return;
            }

            const godziny = (r) =>
              Math.round((Date.now() - new Date(r.created_at).getTime()) / 3600000);
            const najstarszy = Math.max(...runs.map(godziny));

            const wiersze = runs.slice(0, 15).map(
              r => '| ' + godziny(r) + 'h | ' + TICK + r.head_branch + TICK +
                   ' | ' + r.name + ' |');

            const body = [
              '**' + runs.length + ' przebieg(ow) CI czeka na zatwierdzenie.**' +
                ' Najstarszy: **' + najstarszy + 'h**.',
              '',
              'Do wykonania przez firme, nie przez wlasciciela.',
              '',
              'Pull request od kogos, kto zglasza sie tu pierwszy raz, **nie moze',
              'uruchomic wymaganych sprawdzen**, dopoki ktos nie zatwierdzi jego',
              'workflow. Bez tego nie scali sie nigdy, niezaleznie od tego, jak',
              'dobra jest zmiana.',
              '',
              '| Czeka | Galaz | Workflow |',
              '|---|---|---|',
              ...wiersze,
              '',
              '**Zanim zatwierdzisz:** otworz roznice i sprawdz, czy zmiana nie',
              'rusza .github/, tools/ ani zadnego pliku wykonywalnego.',
              'Zatwierdzenie uruchamia kod z cudzego forka na naszych runnerach -',
              'dla zmiany w dokumentacji to nic, dla zmiany w workflow to wszystko.',
              '',
              'Kolejka: https://github.com/' + owner + '/' + repo +
                '/actions?query=is%3Aaction_required',
              '',
              '_To zgloszenie zamknie sie samo, gdy kolejka bedzie pusta._',
            ].join(NL);

            if (open.length) {
              await github.rest.issues.update({
                owner, repo, issue_number: open[0].number, body,
              });
              core.notice('Zaktualizowano #' + open[0].number);
            } else {
              const issue = await github.rest.issues.create({
                owner, repo, title: TYTUL, body,
                // Deliberately unassigned. The owner's instruction on
                // 2026-08-23: the company accepts and acts, and nothing routes
                // to them for approval. Assigning them is what makes GitHub
                // send mail, so leaving it off is the whole mechanism.
                labels: ['stan:zalegle'],
              });
              core.notice('Utworzono ' + issue.data.html_url);
            }

  # Praca kontrybutora zostala scalona, a jego zgloszenie zostalo otwarte.
  #
  # 2026-08-27: #310 od @TrueFurina dodalo Sophosa do listy zgodnosci OAuth i
  # zostalo scalone. Zgloszenie #291, ktore o to prosilo, zostalo otwarte przez
  # kolejne godziny - bo w opisie scalanego wniosku nie bylo `Closes #291`.
  # Z zewnatrz wyglada to tak, jakby czyjas praca zostala zignorowana, i jest to
  # dokladnie ten kontrybutor, ktorego nie stac nam stracic.
  #
  # Ta kontrola jest CELOWO waska. Pierwsza wersja, sprawdzana recznie tego
  # samego dnia, dopasowywala sama nazwe producenta - i wskazala Xeroxa, Ricoha
  # i Canona jako "zrobione", bo ich urzadzenia sa w danych. Tamte zgloszenia
  # dotycza kodow bledow z paneli, nie listy OAuth: narzedzie odpowiedzialo na
  # pytanie "czy producent jest w danych" zamiast na "czy ta praca jest
  # zrobiona". Stad dwa niezalezne zabezpieczenia ponizej - wzorzec tytulu ORAZ
  # etykieta - a nie jedno.
  zrobione-a-otwarte:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner, repo = context.repo.repo;
            const ETYKIETA = 'zrobione-a-otwarte';

            const dane = JSON.parse(
              fs.readFileSync('data/devices.json', 'utf8')).entries;
            const wDanych = JSON.stringify(dane).toLowerCase();

            const watki = (await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100,
            })).data;

            let oznaczonych = 0;
            for (const w of watki) {
              if (w.pull_request) continue;
              const etykiety = (w.labels || []).map(l => l.name);

              // Zabezpieczenie 1: zgloszenia trzymane otwarte swiadomie -
              // te, ktore czekaja na sprzet - nie sa niczyim przeoczeniem.
              if (etykiety.includes('stan:celowe')) continue;
              if (etykiety.includes(ETYKIETA)) continue;

              // Zabezpieczenie 2: wzorzec tytulu. Tylko zgloszenia, ktore
              // prosza dokladnie o wiersz w liscie zgodnosci - nie o kody
              // paneli, nie o cokolwiek innego dotyczacego tego producenta.
              const m = w.title.match(
                /^Add (.+?) to the OAuth compatibility list/i);
              if (!m) continue;

              const producent = m[1].trim().toLowerCase();
              if (producent.length < 3) continue;
              if (!wDanych.includes(producent)) continue;

              await github.rest.issues.addLabels({
                owner, repo, issue_number: w.number, labels: [ETYKIETA],
              });
              await github.rest.issues.createComment({
                owner, repo, issue_number: w.number,
                body: [
                  '`' + m[1].trim() + '` teraz wystepuje w `data/devices.json`,',
                  'a to zgloszenie jest nadal otwarte.',
                  '',
                  'Zwykle znaczy to, ze scalony wniosek nie mial w opisie',
                  '`Closes #' + w.number + '`. Jesli praca jest zrobiona -',
                  'zamknij to zgloszenie i podaj autora. Jesli nie -',
                  'zdejmij etykietke `' + ETYKIETA + '`.',
                  '',
                  'Powod, dla ktorego to nie zamyka sie samo: kontrybutor,',
                  'ktorego praca zostala scalona, a zgloszenie wisi otwarte,',
                  'widzi to jako zignorowanie. Zamkniecie ma miec jego',
                  'nazwisko w tresci.',
                ].join(' ').replace(/  +/g, ' '),
              });
              oznaczonych++;
            }

            core.info(`oznaczonych jako zrobione-a-otwarte: ${oznaczonych}`);

  # Wnioski wyslane do cudzych repozytoriow, ktorych nikt nie pilnuje.
  #
  # 2026-08-29 ten brak wyprodukowal dwie pomylki w jednej godzinie. Zgloszenie
  # #216 zostalo zamkniete jako "nie kwalifikujemy sie", podczas gdy wniosek do
  # tej listy byl otwarty od szesciu dni. Godzine wczesniej o maly wlos nie
  # powstal drugi wniosek do `linsa-io`, bo zgloszenie nie wiedzialo o
  # pierwszym.
  #
  # Wpisy w katalogach sa zmierzonym kanalem tego projektu: free-for.dev daje
  # 20 unikalnych odwiedzajacych na 14 dni, a wszystkie nasze pozycje w
  # wyszukiwarce GitHuba razem - 18. Niepilnowana kolejka wnioskow to
  # niepilnowany kanal.
  wnioski-na-zewnatrz:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const PROG_DNI = 21;

            const wnioski = (await github.rest.search.issuesAndPullRequests({
              q: `is:pr is:open author:${owner} -repo:${owner}/${repo}`,
              per_page: 50,
            })).data.items;

            if (!wnioski.length) {
              core.info('brak otwartych wnioskow na zewnatrz');
              return;
            }

            // Zgloszenia sledzace, po numerze wniosku w tresci lub komentarzu.
            const zgloszenia = (await github.rest.issues.listForRepo({
              owner, repo, state: 'all', labels: 'listing', per_page: 100,
            })).data;

            const dzis = Date.now();
            const stare = [], sieroty = [], zamkniete = [];

            for (const w of wnioski) {
              const gdzie = w.repository_url.split('/').slice(-2).join('/');
              const dni = Math.floor((dzis - new Date(w.created_at)) / 86400000);
              const opis = `${gdzie}#${w.number} (${dni} dni)`;

              // Ktore zgloszenie sledzi ten wniosek?
              const sledzi = zgloszenia.filter((z) =>
                (z.body || '').includes(gdzie) || (z.title || '').includes(gdzie));

              if (!sledzi.length) { sieroty.push(opis); continue; }
              // To jest przypadek, ktory kosztowal nas dzis pomylke: wniosek
              // otwarty, a zgloszenie zamkniete jako zalatwione albo odrzucone.
              if (sledzi.every((z) => z.state === 'closed')) {
                zamkniete.push(`${opis} - a zgloszenie #${sledzi[0].number} jest zamkniete`);
              }
              if (dni >= PROG_DNI) stare.push(opis);
            }

            core.info(`otwartych wnioskow: ${wnioski.length}`);
            for (const z of zamkniete) core.warning(`sprzecznosc: ${z}`);
            for (const s of sieroty) core.notice(`bez zgloszenia sledzacego: ${s}`);
            for (const s of stare) core.notice(`bez odpowiedzi >= ${PROG_DNI} dni: ${s}`);

            // Zamkniete zgloszenie przy otwartym wniosku jest sprzecznoscia,
            // nie przypomnieniem - dlatego tylko ono zaklada zgloszenie.
            if (!zamkniete.length) return;

            const TYTUL = 'Wniosek otwarty, zgloszenie zamkniete';
            const istnieje = (await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100,
            })).data.find((i) => i.title === TYTUL);
            if (istnieje) {
              core.info(`juz zgloszone: #${istnieje.number}`);
              return;
            }

            await github.rest.issues.create({
              owner, repo, title: TYTUL,
              body: [
                'Te wnioski sa otwarte w cudzych repozytoriach, a zgloszenia,',
                'ktore je sledza, sa u nas zamkniete:', '',
                ...zamkniete.map((z) => `- ${z}`), '',
                'Jedno z dwojga jest nieprawda. Albo wniosek trzeba wycofac,',
                'albo zgloszenie otworzyc z powrotem - i to drugie zdarzylo sie',
                '2026-08-29, gdy #216 zamknieto jako "nie kwalifikujemy sie",',
                'a wniosek do tej samej listy czekal otwarty od szesciu dni.',
              ].join('\n'),
            });

  # ETAT, KTORY MIAL SPOJRZEC, I NIE SPOJRZAL.
  #
  # 2026-09-01, wlasciciel: "nie chce w firmie nigdy takich sytuacji, ze ktos
  # na cos nie spojrzal!!!! gdzie jest HR????". Tego dnia szesc scalonych
  # PR-ow - #390, #394, #396, #397, #399, #405 - zwrocilo `0` z
  # `pulls/<n>/reviews`. Wsrod nich PR od czlowieka z zewnatrz uruchamiany na
  # naszych runnerach, nowy job CI i dwie nowe bramki.
  #
  # Szerszy pomiar tego samego dnia: z ostatnich 60 PR-ow dokladnie JEDEN ma
  # jakikolwiek obiekt recenzji (#331), i jest on od
  # `github-advanced-security[bot]`. Zero recenzji od czlowieka, kiedykolwiek.
  # Nie bylo wiec regresu - nadzoru nigdy nie bylo.
  #
  # DLACZEGO BRAMKA, A NIE REGULA: regula "change-board recenzuje kazda zmiane"
  # juz istniala, w pierwszym zdaniu opisu tamtego etatu, i nie wystrzelila ani
  # razu. Ten projekt ma na to zapisane doswiadczenie - buduj bramke, nie pisz
  # reguly.
  #
  # CZEGO TA BRAMKA NIE ROBI: nie blokuje scalenia. `enforce_admins` jest
  # wlaczone a wymaganych recenzji jest zero, wiec `--auto` jest celowo droga,
  # ktora praca lada; wymuszenie recenzji zatrzymaloby projekt. Ta bramka
  # WYKRYWA i MELDUJE - jedna, samozamykajaca sie pozycja, ten sam wzorzec co
  # `zalegle-zewnetrzne` powyzej.
  #
  # Logika jest w `tools/seat-obligations.js`, przetestowana na prawdziwych
  # danych tych szesciu PR-ow w `tools/seat-obligations.test.js` i sprawdzona
  # celowym zepsuciem pieciu porownan. W YAML zostaje samo pobieranie danych.
  etat-nie-spojrzal:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const { raport, wymagaRecenzji, NIEOBSERWOWALNE, OBSADA_ETATOW,
                    OBSADA_ODCZYT } = await import(
              `${process.env.GITHUB_WORKSPACE}/tools/seat-obligations.js`);

            const owner = context.repo.owner, repo = context.repo.repo;
            const OKNO_DNI = 14;
            // Prog wlaczenia bramki. Bez niego pierwszy przebieg zaklada
            // kolejke na 99 pozycji - tyle scalonych PR-ow z ostatnich 14 dni
            // nie ma zadnej recenzji - a scalonego PR-a nie da sie juz sensownie
            // zrecenzowac, wiec taka kolejka NIGDY sie nie oprozni i nigdy sie
            // nie zamknie. Zgloszenie, ktore zawsze jest otwarte, przestaje byc
            // czytane. Historia melduje sie jako jedna liczba w tresci, praca
            // jako wiersze.
            const OD = '2026-09-02T00:00:00Z';
            const TYTUL = 'Etat mial spojrzec i nie spojrzal';
            const NL = String.fromCharCode(10);
            const TICK = String.fromCharCode(96);

            // Polityka nalezy do `change-board`, nie do tej bramki. Gdy jej
            // nie ma, meldujemy wszystko - domysl w strone halasu, bo cisza
            // jest trybem awarii, ktory to zbudowal.
            let polityka = null;
            const sciezka = `${process.env.GITHUB_WORKSPACE}/data/review-policy.json`;
            if (fs.existsSync(sciezka)) {
              try {
                polityka = JSON.parse(fs.readFileSync(sciezka, 'utf8'));
                core.info('Polityka recenzji wczytana od change-board.');
              } catch (e) {
                core.warning(`data/review-policy.json nie parsuje sie: ${e.message}`);
              }
            } else {
              core.info('Brak data/review-policy.json - melduje kazdy scalony PR.');
            }

            const granica = new Date(Date.now() - OKNO_DNI * 86400000).toISOString();

            const scalone = (await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'closed', sort: 'updated', direction: 'desc',
              per_page: 100,
            })).filter((p) => p.merged_at && p.merged_at >= granica);

            // Stan wyjsciowy: ile z okna wypada przed progiem wlaczenia.
            const historyczne = scalone.filter((p) => p.merged_at < OD).length;
            const biezace = scalone.filter((p) => p.merged_at >= OD);

            const obowiazki = [];
            for (const p of biezace) {
              const pr = {
                autor: (p.user || {}).login,
                etykiety: (p.labels || []).map((l) => l.name),
              };
              if (!wymagaRecenzji(pr, polityka, owner)) continue;

              const recenzje = (await github.rest.pulls.listReviews({
                owner, repo, pull_number: p.number, per_page: 100,
              })).data;

              obowiazki.push({
                seat: 'change-board',
                przedmiot: `#${p.number}`,
                trigger: 'PR scalony',
                tytul: p.title || '',
                autor: pr.autor,
                wyzwolonyAt: p.merged_at,
                // Termin to moment scalenia: spojrzenie ma sens PRZED nim.
                terminAt: p.merged_at,
                akty: recenzje.map((r) => ({
                  login: (r.user || {}).login,
                  typ: (r.user || {}).type,
                  at: r.submitted_at,
                })),
                owner,
              });
            }

            const { zwloki, spoznione, poEtacie } = raport(obowiazki, Date.now());

            core.info(`sprawdzonych scalonych PR-ow: ${obowiazki.length}`);
            for (const s of spoznione) {
              core.notice(`${s.przedmiot}: spojrzano, ale dopiero po scaleniu`);
            }

            const dashboard = (await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100,
            })).data.filter((i) => i.title === TYTUL);

            if (!zwloki.length) {
              for (const i of dashboard) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: i.number,
                  body: `Kazdy scalony PR z ostatnich ${OKNO_DNI} dni ma spojrzenie etatu. Zamykam.`,
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: i.number, state: 'closed',
                });
              }
              core.info('Zaden etat nie przegapil swojego wyzwalacza.');
              return;
            }

            const wiersze = zwloki.slice(0, 25).map((z) =>
              `| ${z.przedmiot} | ${z.seat} | @${z.autor} | ${z.trigger} | ` +
              TICK + (z.tytul || '').replace(/\|/g, '\\|').slice(0, 48) + TICK + ' |');

            const podsumowanie = Object.entries(poEtacie)
              .map(([s, n]) => `**${s}**: ${n}`).join(', ');

            const body = [
              `**${zwloki.length} przypadek(ow), gdzie wyzwalacz etatu zadzialal, a etat nie zostawil sladu.**`,
              '',
              `Wedlug etatu: ${podsumowanie}.`,
              '',
              'Ta lista nie jest zarzutem o jakosc pracy. Jest odpowiedzia na',
              'pytanie, ktore 2026-09-01 musial zadac wlasciciel, bo zaden',
              'przyrzad w tej firmie go nie zadawal: **czy etat, ktory MA',
              'zdefiniowany wyzwalacz, faktycznie zadzialal, gdy ten wyzwalacz',
              'wystrzelil.** Wlasnosc powierzchni byla mierzona; wykonanie nie.',
              '',
              '| Przedmiot | Etat | Autor | Wyzwalacz | Tytul |',
              '|---|---|---|---|---|',
              ...wiersze,
              '',
              '### Czego ta bramka NIE widzi',
              '',
              'Zapisane wprost, bo raport milczacy o wlasnym zasiegu klamie',
              'przez pominiecie, a pomiaru niewykonanego nie wolno zapisac',
              'jako zera.',
              '',
              `Stan wyjsciowy: **${historyczne}** PR-ow scalonych w tym oknie`,
              `przed wlaczeniem bramki (${OD.slice(0, 10)}) nie ma zadnej recenzji.`,
              'Nie sa wierszami wyzej, bo scalonego PR-a nie da sie juz',
              'zrecenzowac - kolejka, ktorej nie da sie oproznic, przestaje byc',
              'czytana. Ta liczba jest punktem odniesienia, nie zadaniem.',
              '',
              `Obsada liczy **${OBSADA_ETATOW} etatow** (odczyt ${OBSADA_ODCZYT}).`,
              'Ta bramka karmi na razie **jedna** klase obowiazku - scalony PR',
              'bez recenzji. Pozostale klasy sa w module zdefiniowane, ale',
              '**niekarmione**, i cisza o nich nie znaczy "brak zwloki".',
              '',
              'Etaty, ktorych wyzwalacza API GitHuba w ogole nie pokazuje:',
              '',
              ...NIEOBSERWOWALNE.map((e) => `- ${TICK}${e.seat}${TICK} - ${e.powod}`),
              '',
              'Bramka nie blokuje scalenia i nie ma tego robic: wymaganych',
              'recenzji jest zero celowo, a --auto jest droga, ktora praca',
              'lada. Wykrywa i melduje.',
              '',
              '_To zgloszenie zamknie sie samo, gdy kolejka bedzie pusta._',
            ].join(NL);

            if (dashboard.length) {
              await github.rest.issues.update({
                owner, repo, issue_number: dashboard[0].number, body,
              });
              core.notice(`Zaktualizowano #${dashboard[0].number} - ${zwloki.length} w kolejce.`);
            } else {
              const issue = await github.rest.issues.create({
                owner, repo, title: TYTUL, body, labels: ['raport'],
              });
              core.notice(`Utworzono ${issue.data.html_url}`);
            }
