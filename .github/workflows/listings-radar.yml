name: Listings radar

# Finds curated GitHub lists that ZeroSMTP genuinely belongs on, checks whether
# it is already there, and opens one issue per candidate with a draft entry and
# that list's own submission rules.
#
# This is the highest-yield channel on GitHub that is also entirely within the
# rules: awesome-* lists and free-service directories exist to receive exactly
# this pull request. A merged line in one of them is a permanent, opt-in
# referral from a repo with an audience - the opposite of an unsolicited
# comment, which is what gets accounts flagged.
#
# The same two rules as outreach-watch.yml, for the same reason:
#
#   1. It NEVER opens a pull request and never comments anywhere. It opens an
#      issue containing a draft entry. A person reads the target repo's
#      CONTRIBUTING, edits the entry, and submits it by hand.
#   2. The draft states the limits - 200 messages/day, shared @msgwing.com
#      from-address. List maintainers check, and an entry that oversells gets
#      the project a rejection it cannot re-submit against.

on:
  schedule:
    # Weekly. New lists worth being on do not appear daily, and each candidate
    # costs a human a careful read of somebody else's contribution rules.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const LABEL = 'listing';
            const MAX_NEW = 2;          // a careful submission is an hour of reading
            const MARKER = 'listing-id:';

            // Lists we could plausibly belong on. Deliberately broad on the
            // search side and strict on the filter side - it is cheaper to
            // reject a repo here than to have a human read a dead list.
            // Aimed at directories of *services*, which is what ZeroSMTP is.
            // `awesome selfhosted` and `awesome sysadmin` were here on the
            // first run and produced the only two candidates it queued, both
            // of them dead ends: those lists require Free and Open-Source
            // self-hostable software, every entry carrying a license
            // identifier and a link to its source. A hosted relay whose pitch
            // is "no mail server to run" cannot qualify however the entry is
            // worded, so searching for that whole category was wasted effort.
            const QUERIES = [
              'awesome smtp in:name,description',
              'awesome email in:name,description',
              'free for developers in:name,description',
              'free tier in:name,description',
              'free services developers in:name,description',
              'awesome saas in:name,description',
              // free-for.dev shaped: catalogues of free hosted services, which
              // is the only channel with evidence behind it - a single entry in
              // ripienaar/free-for-dev sends 29% of this project's traffic.
              'free for dev in:name,description',
              'free developer resources in:name,description',
              'awesome free in:name,description',
              'free plan in:name,description',

              // Katalogi narzedzi wiersza polecen. Do 2026-08-25 radar szukal
              // wylacznie katalogow darmowych uslug, bo szkic wpisu byl zakodowany
              // na usluge hostowana. Odkad bramka ksztaltu listy rozstrzyga, ze
              // w liscie oprogramowania startuje CLI `zerosmtp-check`, te lokale sa
              // dla nas osiagalne i nie byly przeszukiwane ani razu.
              'awesome cli in:name,description',
              'awesome command line in:name,description',
              'awesome developer tools in:name,description',
              'awesome devtools in:name,description',
            ];

            // A list has to be alive and read. Both numbers are judgement
            // calls, but the failure they prevent is real: a PR to a list
            // whose last merge was two years ago is an hour spent for nothing.
            const MIN_STARS = 300;
            const MAX_IDLE_DAYS = 180;

            // Our own name, in the forms a list would use it.
            const OURS = ['zerosmtp', 'msgwing'];

            const idle = Date.now() - MAX_IDLE_DAYS * 86400_000;

            // --- what has already been queued -------------------------------------
            const seen = new Set();
            for await (const res of github.paginate.iterator(
              github.rest.issues.listForRepo,
              { owner: context.repo.owner, repo: context.repo.repo,
                state: 'all', labels: LABEL, per_page: 100 })) {
              for (const issue of res.data) {
                const m = (issue.body || '').match(new RegExp(`${MARKER}\\s*(\\S+)`));
                if (m) seen.add(m[1]);
              }
            }
            core.info(`${seen.size} list(s) already queued.`);

            // --- collect ----------------------------------------------------------
            const sleep = ms => new Promise(r => setTimeout(r, ms));
            const repos = new Map();
            let attempted = 0, failed = 0;

            for (const q of QUERIES) {
              attempted++;
              try {
                const res = await github.rest.search.repos({
                  q, sort: 'stars', order: 'desc', per_page: 20,
                });
                for (const r of res.data.items) repos.set(r.full_name, r);
              } catch (e) {
                core.warning(`search "${q}": ${e.message}`);
                failed++;
              }
              await sleep(3000);   // secondary rate limit on the search API
            }

            // A run where every search failed must not look like a quiet week.
            if (attempted > 0 && failed === attempted) {
              core.setFailed(
                `All ${attempted} searches failed. Reporting nothing found ` +
                `would be wrong - this is an outage, not an empty radar.`);
              return;
            }

            // --- filter -----------------------------------------------------------
            const candidates = [];
            let rejected = 0;

            for (const r of repos.values()) {
              const id = `list:${r.full_name}`;
              if (seen.has(id)) continue;
              if (r.owner.login.toLowerCase() === context.repo.owner.toLowerCase()) continue;
              if (r.archived || r.fork) { rejected++; continue; }
              if (r.stargazers_count < MIN_STARS) { rejected++; continue; }
              if (new Date(r.pushed_at).getTime() < idle) { rejected++; continue; }

              // pushed_at says the repository is alive. It does not say the
              // maintainer still merges other people's work, and those came
              // apart badly on 2026-08-22: awesome-sysadmin had been pushed
              // three days earlier and had merged nothing from anyone since
              // June. Of four directories named in a work order, three were
              // dead by this measure and passed every other gate.
              //
              // So ask the only question that matters to us: did an outside
              // contribution land here recently? One extra call per candidate.
              let merges90 = 0;
              try {
                const prs = await github.rest.pulls.list({
                  owner: r.owner.login, repo: r.name,
                  state: 'closed', sort: 'updated', direction: 'desc', per_page: 100,
                });
                const since = Date.now() - 90 * 86400_000;
                merges90 = prs.data.filter(
                  p => p.merged_at && new Date(p.merged_at).getTime() >= since).length;
              } catch (e) {
                // Unreadable is not the same as dead. Say so and move on rather
                // than recording a zero we never measured.
                core.warning(`${r.full_name}: could not read pull requests (${e.message})`);
                rejected++;
                continue;
              }
              if (merges90 === 0) {
                core.info(`${r.full_name}: rejected - no merged pull request in 90 days`);
                rejected++;
                continue;
              }

              // Already listed? Then there is nothing to do, and opening an
              // issue about it would waste the same hour every week.
              let readme = '';
              try {
                const res = await github.rest.repos.getReadme({
                  owner: r.owner.login, repo: r.name,
                });
                readme = Buffer.from(res.data.content, 'base64').toString('utf8');
              } catch (e) {
                core.warning(`${r.full_name}: no readable README (${e.message})`);
                rejected++;
                continue;
              }
              const lower = readme.toLowerCase();
              if (OURS.some(w => lower.includes(w))) {
                core.info(`${r.full_name}: already lists us.`);
                continue;
              }

              // Is it a curated list at all? This gate was missing entirely on
              // the run of 2026-08-17, which queued a database client and a
              // collection of n8n workflow templates - both of them repos whose
              // README happens to contain the word "email", which is true of
              // most repos and says nothing. A directory looks like a
              // directory: dozens of entry-shaped lines.
              const entries = (readme.match(/^[ \t]*[-*] \[[^\]]+\]\(https?:\/\//gm) || []).length;
              if (entries < 40) {
                core.info(`${r.full_name}: only ${entries} list entries - not a directory.`);
                rejected++;
                continue;
              }

              // Whose ecosystem is it? A mail heading is not enough either:
              // a list of Swift libraries has one and will never take a Node
              // CLI, and a list of macOS apps will never take a hosted relay.
              // The first two runs queued matteocrippa/awesome-swift,
              // enescingoz/awesome-n8n-templates and a macOS-only app list,
              // all of which passed every other gate. Eight venues surfaced,
              // three were usable: 37% precision, and this is the half of it
              // that is mechanical.
              //
              // Only ecosystems we are actually in are allowed through. We
              // ship a Node CLI and a hosted service, so a list scoped to any
              // other language or platform is the wrong list no matter how
              // well the entry is written.
              const NASZE = ['node', 'nodejs', 'javascript', 'cli', 'npm'];
              const OBCE = [
                'swift', 'rust', 'golang', ' go ', 'python', 'php', 'ruby',
                'kotlin', 'java ', 'flutter', 'dart', 'react', 'vue', 'angular',
                'n8n', 'wordpress', 'laravel', 'django', 'macos', 'mac os',
                'ios', 'android', 'unity', 'godot', 'elixir', 'scala',
              ];
              const tozsamosc = ((r.name || '') + ' ' + (r.description || '')).toLowerCase();
              const obcy = OBCE.find(w => tozsamosc.includes(w));
              if (obcy && !NASZE.some(w => tozsamosc.includes(w))) {
                core.info(`${r.full_name}: rejected - scoped to ${obcy.trim()}, `
                  + `which is not an ecosystem this project is in`);
                rejected++;
                continue;
              }

              // Który z naszych dwóch bytów tu startuje? Radar opisywał lokal
              // i nigdy tego nie rozstrzygał, więc szkic zawsze proponował
              // usługę hostowaną. 2026-08-25 kosztowało to zamknięcie
              // Axorax/awesome-free-apps jako "nie kwalifikujemy się", podczas
              // gdy leżał tam nasz poprawny, otwarty PR - bo złożone było CLI,
              // a oceniana była usługa. Dwa byty, rozłączne zbiory list.
              //
              // Sygnał jest mechaniczny: lista programów do zainstalowania
              // znaczy wpisy emoji platformy. Zmierzone na awesome-free-apps:
              // 601 wpisów, praktycznie każdy z emoji Windows/macOS/Linux,
              // a jedyne wiersze bez nich to automatyczny spis treści.
              const PLAT = [0x1FA9F, 0x1F34E, 0x1F427].map(c => String.fromCodePoint(c));
              const wiersze = readme.match(/^[ \t]*[-*] \[[^\]]+\]\(https?:\/\/.*$/gm) || [];
              const zPlatforma = wiersze.filter(w => PLAT.some(e => w.includes(e))).length;
              const udzial = wiersze.length ? zPlatforma / wiersze.length : 0;
              // Emoji platformy to sygnal wtorny, nie jedyny. Zmierzone na
              // agarrharr/awesome-cli-apps: 0% wpisow niesie emoji, a to jest
              // katalog narzedzi wiersza polecen - czyli dokladnie tam, gdzie
              // startuje `zerosmtp-check`. Pierwsza wersja tej bramki wskazala
              // tam usluge i myslila sie; sprawdzenie na dwoch lokalach przeszlo,
              // bo oba mialy emoji albo nie mialy nic. Tozsamosc lokalu jest
              // mocniejszym dowodem niz sposob, w jaki formatuje wiersze.
              const NARZEDZIOWE = /\b(cli|command[- ]?line|terminal|devtools|developer tools|shell)\b/i;
              const nazwaLokalu = (r.name || '') + ' ' + (r.description || '');
              const kandydat = (udzial > 0.5 || NARZEDZIOWE.test(nazwaLokalu)) ? 'cli' : 'usluga';

              // And it has to have a section this belongs in - a *heading*,
              // not the word somewhere in the prose. A general list with no
              // mail section is not a rejection of the project, it is simply
              // the wrong list, and submitting anyway is how a maintainer
              // learns to ignore you.
              // Kandydat CLI trafia pod inny naglowek. Katalog narzedzi wiersza
              // polecen dzieli sie wedlug funkcji - Network, Sysadmin, DevOps -
              // i sekcji o poczcie zwykle nie ma wcale. Przebieg 2026-08-25
              // odrzucil z tego powodu liste o 246 wpisach, w ktorej sprawdzacz
              // polaczenia SMTP jest dokladnie na miejscu.
              const SEKCJA_USLUGA = /^#{1,4}[ \t]+.*\b(e-?mail|smtp|mail|transactional)\b.*$/im;
              const SEKCJA_CLI = /^#{1,4}[ \t]+.*\b(e-?mail|smtp|mail|network|networking|sysadmin|devops|monitoring|utilities|internet)\b.*$/im;
              const heading = readme.match(kandydat === 'cli' ? SEKCJA_CLI : SEKCJA_USLUGA);
              if (!heading) {
                core.info(`${r.full_name}: ${entries} entries but no mail section.`);
                rejected++;
                continue;
              }
              const section = heading[0].replace(/^#+\s*/, '').trim().slice(0, 60);


              // What kind of list is it? Having a mail section is not enough,
              // and this is where the first run went wrong: it queued
              // awesome-selfhosted and awesome-sysadmin, both of which
              // require Free and Open-Source self-hostable software with a
              // license identifier and a source URL per entry. ZeroSMTP is a
              // hosted service that explicitly cannot be self-hosted, so no
              // wording of the entry could have passed. Two careful hours
              // would have been spent finding that out by hand.
              const scope = (r.description || '') + ' ' + readme.slice(0, 4000);
              const scopeLower = scope.toLowerCase();
              // Rozdzielone, bo te dwie grupy znacza co innego dla naszych dwoch
              // produktow. Serwer do samodzielnego postawienia nie jest ani usluga
              // hostowana, ani sprawdzaczem w wierszu polecen - odrzuca oba. Ale
              // "otwartozrodlowe" odrzuca tylko usluge: `zerosmtp-check` jest na
              // licencji MIT z linkiem do repozytorium, czyli dokladnie tym, czego
              // taka lista wymaga.
              const SAMOHOSTING = ['self-hosted', 'self hosted', 'selfhosted', 'self-hosting'];
              const TYLKO_OTWARTE = ['open source software', 'open-source software', 'foss', 'libre software'];
              const disqualifier = SAMOHOSTING.find(w => scopeLower.includes(w))
                || (kandydat === 'usluga' ? TYLKO_OTWARTE.find(w => scopeLower.includes(w)) : undefined);
              if (disqualifier) {
                core.info(`${r.full_name}: scoped to ${disqualifier} software - we are a hosted service.`);
                rejected++;
                continue;
              }

              // Several large lists have moved contributions elsewhere and
              // say so in the PR template. Queuing the reading repository
              // sends a person to a pull request that will be closed
              // unread, so carry the redirect through to the draft instead.
              let prTarget = null;
              try {
                const tpl = await github.rest.repos.getContent({
                  owner: r.owner.login, repo: r.name,
                  path: '.github/PULL_REQUEST_TEMPLATE.md',
                });
                const text = Buffer.from(tpl.data.content, 'base64').toString('utf8');
                const m = text.match(/https?:\/\/github\.com\/[\w.-]+\/[\w.-]+/);
                if (/do not submit|don't submit|use .* instead|open .* in the/i.test(text) && m) {
                  prTarget = m[0];
                }
              } catch { /* no template, which is the common case */ }

              // Whether self-submission is even allowed is decided by their
              // CONTRIBUTING, which a human must read. We only record whether
              // there is one, so the draft can point at the right file.
              let contributing = null;
              for (const path of ['CONTRIBUTING.md', '.github/CONTRIBUTING.md', 'contributing.md']) {
                try {
                  await github.rest.repos.getContent({
                    owner: r.owner.login, repo: r.name, path,
                  });
                  contributing = path;
                  break;
                } catch { /* next */ }
              }

              candidates.push({
                kandydat,
                udzial: Math.round(udzial * 100),
                id,
                full_name: r.full_name,
                url: r.html_url,
                stars: r.stargazers_count,
                merges90,
                pushed: r.pushed_at.slice(0, 10),
                license: r.license ? r.license.spdx_id : 'none',
                section,
                contributing,
                prTarget,
              });
              await sleep(500);
            }

            core.info(`${rejected} repo(s) rejected as dead, too small or off-topic.`);

            // Biggest audience first, among lists that are actually maintained.
            candidates.sort((a, b) => b.stars - a.stars);
            const picked = candidates.slice(0, MAX_NEW);

            if (picked.length === 0) {
              core.notice(
                `Nothing new. ${repos.size} repo(s) seen, ` +
                `${failed}/${attempted} searches failed.`);
              return;
            }

            // --- draft --------------------------------------------------------------
            // Dwa byty, dwa szkice. Który z nich wchodzi, rozstrzyga bramka
            // kształtu listy wyżej - nie autor zgłoszenia w biegu.
            const ENTRY_USLUGA =
              '- [ZeroSMTP](https://msgwing.com) — Free SMTP relay that still ' +
              'accepts plain username-and-password SMTP AUTH, for printers, ' +
              'scanners, NAS units and legacy apps that cannot do OAuth2. ' +
              '200 messages/day; sends from a shared @msgwing.com address ' +
              'rather than your own domain.';

            // Sformułowanie wzięte z wpisu, który faktycznie przeszedł format
            // Axorax/awesome-free-apps#275 - nie napisane od nowa.
            const ENTRY_CLI =
              '- [zerosmtp-check](https://github.com/msgwing/ZeroSMTP/tree/main/packages/zerosmtp-check) ' +
              '- Checks whether outbound SMTP works from a machine, testing ports, ' +
              'TLS and authentication, and explains the error your mail client printed.';

            for (const c of picked) {
              const body = [
                `<!-- ${MARKER} ${c.id} -->`,
                `**[${c.full_name}](${c.url})** — ${c.stars} stars · last push ${c.pushed} · **${c.merges90} outside pull requests merged in the last 90 days**`,
                `· license \`${c.license}\` · matched on section keyword \`${c.section}\``,
                '',
                c.contributing
                  ? `Contribution rules: [\`${c.contributing}\`](${c.url}/blob/HEAD/${c.contributing}) — **read it in full before writing anything.**`
                  : '⚠️ No `CONTRIBUTING.md` found. Read the README\'s own submission section instead; do not guess the format.',
                '',
                ...(c.prTarget
                  ? [`⚠️ **This repository does not take pull requests.** Its PR template redirects to ${c.prTarget} — submit there, not here.`, '']
                  : []),
                c.kandydat === 'cli'
                  ? `**Kandydatem jest CLI \`zerosmtp-check\`, nie usługa.** ${c.udzial}% wpisów tej listy niesie emoji platformy, czyli jest to lista oprogramowania do zainstalowania. Usługa hostowana nie ma tu kategorii; narzędzie uruchamiane poleceniem ma.`
                  : `**Kandydatem jest usługa ZeroSMTP.** Tylko ${c.udzial}% wpisów niesie emoji platformy, więc lista nie jest katalogiem programów do zainstalowania i wpis o usłudze ma tu sens.`,
                '',
                'Nothing has been submitted. This is a draft.',
                '',
                '### Check before submitting',
                '',
                '- [ ] The list actually accepts hosted services. If every entry carries a license and a source link, it is a list of self-hostable software and ZeroSMTP cannot qualify however the entry is worded — close this.',
                '- [ ] Self-submission is permitted. If it is forbidden, close this — slipping one in gets the project banned from the list permanently.',
                '- [ ] If it is permitted but must be disclosed, the PR body discloses it.',
                '- [ ] The entry sits in the right section, in the right alphabetical position.',
                '- [ ] The format matches the neighbouring lines exactly — dash style, trailing period, link form.',
                '- [ ] Any minimum age, star count or license requirement is met.',
                '- [ ] Their linter (`awesome-lint`, `remark`) passes locally.',
                '- [ ] Sklonowane przez `git -c core.autocrlf=false clone` - inaczej Windows przepisze konce wierszy calego pliku.',
                '- [ ] Po commicie, przed `git push`: `python tools/check-submission.py --repo <klon> --max-lines 3` wychodzi czysto. Jednolinijkowy wpis wyszedl juz raz jako commit na 4417 linii.',
                '',
                '---',
                '',
                '### Draft entry',
                '',
                '```markdown',
                c.kandydat === 'cli' ? ENTRY_CLI : ENTRY_USLUGA,
                '```',
                '',
                'The 200/day cap and the shared from-address stay in. They are ' +
                'what make the entry survive review — a list maintainer checks, ' +
                'and an entry that hides its limits is rejected once and ' +
                'remembered afterwards.',
                '',
                '---',
                '',
                'Close this issue once the PR is open, or if the list turns out ' +
                'not to fit. Closed issues are remembered, so it will not be ' +
                'queued again.',
              ].join('\n');

              // Deliberately not assigned. A raw candidate is not finished
              // work, and the owner's inbox is for finished work only -
              // reviewing the first assigned queue found eight leads and zero
              // actionable ones. It is labelled `do-akceptacji` after
              // qualification, and ready-for-approval.yml does the assigning
              // then, which is also the only way the notification fires.
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Listing: ${c.full_name}`.slice(0, 200),
                body,
                labels: [LABEL],
              });
              core.notice(`Queued #${created.data.number} — ${c.url}`);
            }

            core.notice(
              `${picked.length} queued of ${candidates.length} candidate(s) ` +
              `(${repos.size} repos seen, ${failed}/${attempted} searches failed).`);
