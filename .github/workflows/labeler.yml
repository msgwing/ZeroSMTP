name: PR labeler

# Labels PRs by which files they touch (language example, docs, CI config),
# using the path rules in .github/labeler.yml. actions/labeler doesn't
# create missing labels itself, so the first step ensures they all exist
# before labeler runs. pull_request_target (not pull_request) is required
# so the token has write access to add labels on PRs from forks — this
# workflow never checks out or executes the PR's own code.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const labels = {
              python: 'ffd343', php: '777bb4', node: '5fa04e', bash: '4eaa25',
              powershell: '012456', java: 'b07219', csharp: '178600',
              go: '00add8', ruby: 'cc342d', rust: 'dea584', kotlin: 'a97bff',
              swift: 'f05138', docs: '0075ca', ci: '2088ff',
            };
            for (const [name, color] of Object.entries(labels)) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  color,
                });
              } catch (err) {
                // Already exists — fine.
              }
            }

      - uses: actions/labeler@v7
