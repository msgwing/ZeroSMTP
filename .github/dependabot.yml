version: 2
updates:
  # One entry per language ecosystem that actually has a manifest file in
  # this repo (python/go/ruby examples are stdlib-only, so no ecosystem
  # entry exists for them).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # v3's Swiftly-based install fails GPG verification on GitHub-hosted
      # runners ("gpg: Can't check signature: No public key") — a confirmed,
      # still-open upstream bug: github.com/swift-actions/setup-swift/issues/798.
      # Remove this once that's fixed upstream.
      - dependency-name: "swift-actions/setup-swift"
        versions: ["3.x"]
